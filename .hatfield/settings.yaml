tui:
    theme: cyberpunk
tools:
    bash:
        background_prompt_threshold_seconds: 15
logging:
    level: info
    max_files: 2
extensions:
    enabled:
        - Ineersa\HatfieldExt\TaskWorkflow\TaskWorkflowExtension
        - Ineersa\HatfieldExt\FileRewind\FileRewindExtension
        - Ineersa\HatfieldExt\CastorLlmMode\CastorLlmModeExtension
        - Ineersa\HatfieldExt\ObservationalMemory\ObservationalMemoryExtension
        - Ineersa\HatfieldExt\Jbcontext\JbcontextExtension
    settings:
        task_workflow:
            task_root: /home/ineersa/projects/agent-core-tasks
        castor_llm_mode:
            enabled: true
        observational_memory:
            storage: { database: .hatfield/extensions-data/observational-memory/om.sqlite }
            model: llama_cpp/flash
            observer: { context_window_ratio: 0.35 }
            reflector: { reflect_after_observation_tokens: 40000 }
            pools: { observations_max_tokens: 30000 }
        safe_guard:
            allow_write_outside_cwd: [/home/ineersa/projects/agent-core-worktrees, /tmp]
forks:
    model: grok-cli/grok-composer-2.5-fast
    thinking_level: medium
    extensions:
        enabled:
            - Ineersa\HatfieldExt\CastorLlmMode\CastorLlmModeExtension
        always_on: {}
context_budget_reminders:
    early_input_tokens: 200000
    urgent_remaining_tokens: 20000
agents:
    extensions:
        always_on: {}
ai:
    providers:
        llama_cpp:
            type: generic
            enabled: true
            base_url: 'http://192.168.2.38:8052/v1'
            api: openai-completions
            api_key: dummy
            completions_path: /chat/completions
            embeddings_path: /embeddings
            supports_completions: true
            supports_embeddings: false
            supports_thinking_levels: false
            models: { flash: { name: flash, context_window: 160000, max_tokens: 65536, input: [text, image], tool_calling: true, reasoning: true, cost: { input: 0, output: 0, cache_read: 0, cache_write: 0 } } }
        llama_cpp_test:
            type: generic
            enabled: true
            base_url: 'http://192.168.2.38:9052/v1'
            api: openai-completions
            api_key: dummy
            completions_path: /chat/completions
            embeddings_path: /embeddings
            supports_completions: true
            supports_embeddings: false
            supports_thinking_levels: false
            models: { test: { name: test, context_window: 32768, max_tokens: 32768, input: [text, image], tool_calling: true, reasoning: false, cost: { input: 1000, output: 100000, cache_read: 0, cache_write: 0 } } }
