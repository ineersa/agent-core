tui:
    theme: oh-p-dark
tools:
    # Set bash.max_timeout_seconds to a positive integer to impose an operator cap.
    code_mode:
        enabled: true
logging:
    level: info
    max_files: 2
extensions:
    enabled:
        - Ineersa\CodingAgent\Extension\Builtin\Scheduling\SchedulingExtension
        - Ineersa\HatfieldExt\TaskWorkflow\TaskWorkflowExtension
        - Ineersa\HatfieldExt\ObservationalMemory\ObservationalMemoryExtension
        - Ineersa\HatfieldExt\Hatfield360\Hatfield360Extension
    # Project-only additions to the resolved enabled list, even when replaced above.
    project_extensions: []
    settings:
        # OM requires observational_memory.librarian.url in user/project settings.
        # Optional librarian.token (literal or env:NAME) is shared by MCP and REST.
        # Deploy only after Librarian discovery/import and backup restore gates pass.
        task_workflow:
            repository: ineersa/agent-core
            remote: origin
            base_branch: main
            worktree_root: ../agent-core-worktrees
            workflow_field: Hatfield Status
            merge_method: merge
            hooks:
                setup:
                    script: .hatfield/task-hooks/setup.sh
                    timeout_seconds: 900
                validate:
                    script: .hatfield/task-hooks/validate.sh
                    timeout_seconds: 1800
                cleanup:
                    script: .hatfield/task-hooks/cleanup.sh
                    timeout_seconds: 300
        safe_guard:
            allow_write_outside_cwd: [/home/ineersa/projects/agent-core-worktrees, /tmp, /home/ineersa/projects/symfony, /home/ineersa/projects/ai]
forks:
    enabled: true
    model: openai-codex/gpt-6.2-sol
    thinking_level: low
    extensions:
        enabled: {}
context_budget_reminders:
    early_input_tokens: 200000
    urgent_remaining_tokens: 20000
    disable_for_main: true
    disable_for_forks: false
    disable_for_subagents: false
agents:
    extensions:
        always_on: {}
ai:
    providers:
        openai-codex:
            enabled: true
            type: chatgpt
            base_url: https://api.openai.com
            completions_path: /v1/responses
            compatibility:
                supports_reasoning_effort: false
                thinking_format: chatgpt
        llama_cpp_test:
            type: generic
            enabled: true
            base_url: 'http://10.0.0.89:9052/v1'
            api_key: dummy
            completions_path: /chat/completions
            embeddings_path: /embeddings
            supports_completions: true
            supports_embeddings: false
            supports_thinking_levels: false
            models: { test: { name: test, context_window: 32768, max_tokens: 32768, input: [text, image], tool_calling: true, reasoning: false, cost: { input: 1000, output: 100000, cache_read: 0, cache_write: 0 } } }
