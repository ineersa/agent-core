# Datadog Agent Process Check for Hatfield CLI and worker processes.
#
# Install to:
#   /etc/datadog-agent/conf.d/process.d/conf.yaml
#
# Each instance is a mutually exclusive process group. exact_match: false uses
# Python re.search() against the joined command line (Datadog Process Check
# source). Keep patterns non-overlapping so CPU/RSS/I/O are not double-counted.
# There is no leftover aggregate "hatfield" instance.
#
# process_name tags come from the instance name. Use them for role selectors:
#   process_name:hatfield.screen
#   process_name:hatfield.controller
#   process_name:hatfield.run_control
#
# Process I/O metrics (system.processes.ioread_bytes(_count) and
# iowrite_bytes(_count)) are emitted by this check when the Agent can read
# /proc/<pid>/io. Verify both series with `datadog-agent check process` before
# adding I/O widgets.

init_config:

instances:
  - name: hatfield.controller
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+agent(?!\S).*(?:^|\s)--controller(?:\s|=|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:controller
    min_collection_interval: 15

  - name: hatfield.headless
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+agent(?!\S).*(?:^|\s)--headless(?:\s|=|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:headless
    min_collection_interval: 15

  - name: hatfield.screen
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+agent(?!\S)(?!.*(?:^|\s)--(?:controller|headless)(?:\s|=|$))'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:screen
    min_collection_interval: 15

  - name: hatfield.run_control
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+messenger:consume\s+run_control(?:\s|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:run_control
    min_collection_interval: 15

  - name: hatfield.llm
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+messenger:consume\s+llm(?:\s|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:llm
    min_collection_interval: 15

  - name: hatfield.tool
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+messenger:consume\s+tool(?:\s|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:tool
    min_collection_interval: 15

  - name: hatfield.agent_worker
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+messenger:consume\s+agent(?:\s|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:agent_worker
    min_collection_interval: 15

  - name: hatfield.mcp
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+messenger:consume\s+mcp(?:\s|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:mcp
    min_collection_interval: 15

  - name: hatfield.extension_agent
    search_string:
      - '(?:hatfield\.phar|bin/console)\s+messenger:consume\s+extension_agent(?:\s|$)'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:extension_agent
    min_collection_interval: 15
