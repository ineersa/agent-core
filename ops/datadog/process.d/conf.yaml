# Datadog Agent Process Check for Hatfield CLI and worker processes.
#
# Install to:
#   /etc/datadog-agent/conf.d/process.d/conf.yaml
#
# Each instance is a mutually exclusive process group. exact_match: false uses
# Python re.search() against the joined command line (Datadog Process Check
# source). Hatfield keeps the original OS launch identity and appends
# hatfield.role.<role> after Symfony resolves the command, so these patterns
# match only that anchored suffix. Keep patterns non-overlapping so CPU/RSS/I/O
# are not double-counted. There is no leftover aggregate "hatfield" instance.
#
# process_name tags come from the instance name. Use them for role selectors:
#   process_name:hatfield.screen
#   process_name:hatfield.controller
#   process_name:hatfield.run_control
#
# Process I/O metrics (system.processes.ioread_bytes(_count) and
# iowrite_bytes(_count)) are emitted by this check when the Agent can read
# /proc/<pid>/io. Verify both series with `datadog-agent check process` before
# adding I/O widgets.
#
# Deploy note: copy this file and restart datadog-agent. Old binaries that never
# append hatfield.role.* markers will not match these instances.

init_config:

instances:
  - name: hatfield.controller
    search_string:
      - '(?:^|[\x00\s])hatfield\.role\.controller(?:[\x00\s]*)$'
    exact_match: false
    service: hatfield
    tags:
      - env:dev
      - app:hatfield
      - process_role:controller
    min_collection_interval: 15

  - name: hatfield.headless
    search_string:
      - '(?:^|[\x00\s])hatfield\.role\.headless(?:[\x00\s]*)$'
    exact_match: false
