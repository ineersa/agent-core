# Test environment service overrides.
#
# These are automatically loaded by Kernel::configureContainer()
# as services_{environment}.yaml when APP_ENV=test.

services:
  # BackgroundProcessManager in test env: do NOT register a PHP shutdown
  # handler. In production the handler terminates owned foreground
  # processes, not accepted background jobs. IsolatedKernelTestCase closes
  # the EntityManager in tearDown(), and DAMA/DoctrineTestBundle rolls
  # back the transaction after each test. A registered shutdown function
  # that queries Doctrine after these operations would fail.
  #
  # Test classes that explicitly need shutdown behavior call
  # $manager->shutdownCleanup() directly.
  #
  # This MUST be a complete, self-contained service definition.
  # Partial overrides (only the parts you want to change) are NOT
  # supported — any service listed here replaces the full definition.
  Ineersa\CodingAgent\Tool\BackgroundProcessManager:
    arguments:
      $store: '@Ineersa\CodingAgent\Tool\BackgroundProcess\ProcessStore'
      $lifecycle: '@Ineersa\CodingAgent\Tool\BackgroundProcess\ProcessLifecycle'
      $config: '@Ineersa\CodingAgent\Config\BackgroundProcessConfig'
      $logger: '@Psr\Log\LoggerInterface'
    # No calls: registerShutdownHandler is intentionally omitted.

  # Keep the default disabled diagnostics path deterministic in APP_ENV=test.
  # Host relaunches may export HATFIELD_WRITE_PROMPT_CACHE_DIAGNOSTICS=1 for
  # evidence capture; that must not flip the container subscriber used by the
  # explicit disabled regression. Enabled-path tests construct the subscriber
  # with writeDiagnostics=true directly.
  Ineersa\CodingAgent\Agent\Diagnostics\PromptCacheDiagnosticsInvocationSubscriber:
    arguments:
      $store: '@Ineersa\CodingAgent\Agent\Diagnostics\PromptCacheDiagnosticsStore'
      $modelCatalog: '@Ineersa\CodingAgent\Config\Ai\HatfieldModelCatalog'
      $logger: '@Psr\Log\LoggerInterface'
      $writeDiagnostics: false

  # TEST-ONLY public alias so the disabled-path regression can fetch the real
  # wired subscriber without making the production service public.
  test.prompt_cache_diagnostics_invocation_subscriber:
    alias: Ineersa\CodingAgent\Agent\Diagnostics\PromptCacheDiagnosticsInvocationSubscriber
    public: true

  # In-memory ExtensionApiInterface test double for extension loading tests.
  # Does NOT override the production ExtensionApiInterface alias
  # (which stays on ExtensionToolRegistryBridge so SafeGuard and
  #  integration tests keep using the real bridge).
  # Available via container autowiring or direct instantiation.
  Ineersa\CodingAgent\Tests\Extension\InMemoryExtensionApiBridge:
    public: true

  # TEST-ONLY public alias. Production SettingsValueResolver stays private;
  # this exposes the real service (with dedicated strict accessor wiring) for
  # container regression tests without redefining it.
  test.settings_value_resolver:
    alias: Ineersa\CodingAgent\Config\SettingsValueResolver
    public: true

  # TEST-ONLY public alias for project-scoped controller owner lock factory.
  # Production service stays private; proves FlockStore is under %app.cwd%, not
  # kernel.project_dir-partitioned FrameworkBundle default flock.
  test.hatfield.controller.session_owner.lock_factory:
    alias: hatfield.controller.session_owner.lock_factory
    public: true

  # Retain the real updater and its dedicated factory for the wiring proof.
  test.hatfield.extension_update.service:
    alias: Ineersa\CodingAgent\Extension\ExtensionUpdateService
    public: true

  # Model requests in the test container never fall back to a real transport.
  Ineersa\CodingAgent\Infrastructure\SymfonyAi\llm.http_client:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Ineersa\CodingAgent\Tests\Support\ProviderCassetteHttpClientFactory', 'offline']
    public: true

  # Deterministic /usage provider quota HTTP for APP_ENV=test (TUI E2E + unit).
  # Keeps the real ProviderQuotaProbeService; MockHttpClient never contacts networks.
  Ineersa\CodingAgent\Infrastructure\ProviderQuota\ProviderQuotaProbeService.http_client:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Ineersa\CodingAgent\Tests\Infrastructure\ProviderQuota\FakeProviderQuotaHttpClientFactory', 'create']

  # TEST-ONLY access to the private operational projection repository for
  # kernel/database integration tests. The production service remains private.
  test.run_operational_projection_repository:
    alias: Ineersa\CodingAgent\Repository\RunOperationalProjectionRepository
    public: true
