services:
  _defaults:
    autowire: true
    autoconfigure: true

  Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexAuthFileStore:
    arguments:
      $path: '@=service("Ineersa\\CodingAgent\\Config\\SettingsPathResolver").getHomeDir() ~ "/.hatfield/auth.json"'
      $lockFactory: '@Symfony\Component\Lock\LockFactory'

  Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexAuthStorageInterface: '@Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexAuthFileStore'

  Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexOAuthConfig:
    arguments:
      $originator: 'hatfield'

  Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexTokenRefresher: ~
  Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexOAuthService: ~
  Symfony\AI\Platform\Bridge\OpenAICodex\Auth\CodexAuthCommand: ~

  Symfony\AI\Platform\Bridge\OpenAICodex\CodexWebSocketConnectionCache:
    shared: true
