# Curated Hatfield-provided extensions offered by extensions:setup.
# Keep package versions pinned; do not invent newer releases here.
# guided_fields drive the native settings list (label/default/type only).
packages:
    - id: safe-guard
      name: SafeGuard
      builtin: true
      extension_class: Ineersa\CodingAgent\Extension\Builtin\SafeGuard\SafeGuardExtension
      settings_key: safe_guard
      guided_fields:
          - id: sg.auto_deny_in_noninteractive
            path: auto_deny_in_noninteractive
            type: bool
            label: Auto-deny noninteractive
            description: Block instead of RequireApproval when no approval channel is present.
            default: true
          - id: sg.allow_write_outside_cwd
            path: allow_write_outside_cwd
            type: absolute_path_list
            label: Allow write outside CWD
            description: 'YAML sequence of absolute paths where outside-CWD writes are allowed (example: [/tmp/extra, /var/data]).'
            default: []
          - id: sg.allow_command_patterns
            path: allow_command_patterns
            type: csv_list
            label: Allow command patterns
            description: "YAML sequence of command substrings that bypass destructive checks (example: ['echo hello, world'])."
            default: []
          - id: sg.protected_read_patterns
            path: protected_read_patterns
            type: csv_list
            label: Extra protected reads
            description: 'YAML sequence of extra protected-read patterns on top of built-in secret-path defaults.'
            default: []
          - id: sg.dangerous_command_patterns
            path: dangerous_command_patterns
            type: csv_list
            label: Extra dangerous commands
            description: 'YAML sequence of extra dangerous command substrings.'
            default: []
    - id: task-workflow
      name: Task Workflow
      builtin: false
      package: ineersa/hatfield-ext-task-workflow
      version: 0.0.42
      extension_class: Ineersa\HatfieldExt\TaskWorkflow\TaskWorkflowExtension
      settings_key: task_workflow
      guided_fields:
          - id: tw.task_root
            path: task_root
            type: path_string
            label: Task board root
            description: Absolute or project-relative path to the external task board. Leave blank to use sibling discovery / env.
            default: ''
    - id: file-rewind
      name: File Rewind
      builtin: false
      package: ineersa/hatfield-ext-file-rewind
      version: 0.0.42
      extension_class: Ineersa\HatfieldExt\FileRewind\FileRewindExtension
      settings_key: file_rewind
      guided_fields:
          - id: fr.enabled
            path: enabled
            type: bool
            label: File Rewind active
            description: extensions.settings.file_rewind.enabled (class must still be in extensions.enabled).
            default: true
          - id: fr.max_retained_turns
            path: max_retained_turns
            type: positive_int
            label: Max retained turns
            description: Newest-N checkpoint rows retained in the project ledger.
            default: 100
          - id: fr.git_timeout_seconds
            path: git_timeout_seconds
            type: positive_int
            label: Git timeout seconds
            description: Timeout for hidden-git snapshot operations.
            default: 30
    - id: observational-memory
      name: Observational Memory
      builtin: false
      package: ineersa/hatfield-ext-observational-memory
      version: 0.0.42
      extension_class: Ineersa\HatfieldExt\ObservationalMemory\ObservationalMemoryExtension
      settings_key: observational_memory
      guided_fields:
          - id: om.model
            path: model
            type: model_id
            label: Shared model
            description: 'Exact provider/model id shared by Observer/Reflector/Dropper (example: llama_cpp/flash or local/Qwen/Qwen3).'
            default: ''
          - id: om.database
            path: storage.database
            type: path_string
            label: Database path
            description: SQLite path for observational memory storage.
            default: .hatfield/extensions-data/observational-memory/om.sqlite
          - id: om.context_window_ratio
            path: observer.context_window_ratio
            type: open_unit_ratio
            label: Observer context ratio
            description: Fraction of the model context window used by Observer (exclusive 0..1).
            default: 0.65
          - id: om.reflect_after_observation_tokens
            path: reflector.reflect_after_observation_tokens
            type: positive_int
            label: Reflect after tokens
            description: Observation-token threshold before Reflector runs.
            default: 40000
          - id: om.observations_max_tokens
            path: pools.observations_max_tokens
            type: positive_int
            label: Observations pool max tokens
            description: Max tokens retained in the observations pool.
            default: 30000
          - id: om.semantic_embedding_base_url
            path: semantic.embedding_api.base_url
            type: path_string
            label: Embedding base URL
            description: Optional OpenAI-compatible embedding base URL. Leave blank with the embedding model blank to keep exact search.
            default: ''
          - id: om.semantic_embedding_model_id
            path: semantic.embedding_api.model_id
            type: path_string
            label: Embedding model id
            description: Embedding endpoint model id. Required with the embedding base URL; leave both blank to keep exact search.
            default: ''
          - id: om.semantic_embedding_query_prefix
            path: semantic.embedding_api.query_prefix
            type: path_string
            label: Embedding query prefix
            description: Optional query-only prefix joined with one space. Applies only when embeddings are configured.
            default: ''
          - id: om.semantic_embedding_chunk_bytes
            path: semantic.embedding_api.chunk_bytes
            type: positive_int
            label: Embedding chunk bytes
            description: Maximum UTF-8-safe document chunk size in bytes (at least 4). Used only when embeddings are configured.
            default: 1200
          - id: om.semantic_embedding_overlap_bytes
            path: semantic.embedding_api.overlap_bytes
            type: nonnegative_int
            label: Embedding overlap bytes
            description: Chunk overlap in bytes; must be smaller than chunk bytes. Used only when embeddings are configured.
            default: 192
          - id: om.semantic_embedding_max_lines
            path: semantic.embedding_api.max_lines
            type: positive_int
            label: Embedding max lines
            description: Maximum lines per document chunk. Used only when embeddings are configured.
            default: 80
          - id: om.semantic_embedding_batch_size
            path: semantic.embedding_api.batch_size
            type: positive_int
            label: Embedding batch size
            description: Inputs per embedding request. Used only when embeddings are configured.
            default: 4
          - id: om.semantic_reranker_base_url
            path: semantic.reranker_api.base_url
            type: path_string
            label: Reranker base URL
            description: Optional /rerank base URL. Requires embeddings; leave blank with the reranker model blank to skip reranking.
            default: ''
          - id: om.semantic_reranker_model_id
            path: semantic.reranker_api.model_id
            type: path_string
            label: Reranker model id
            description: Reranker endpoint model id. Required with the reranker base URL; leave both blank to skip reranking.
            default: ''
          - id: om.semantic_reranker_batch_size
            path: semantic.reranker_api.batch_size
            type: positive_int
            label: Reranker batch size
            description: Maximum documents per rerank request. Used only when a reranker is configured.
            default: 8
          - id: om.semantic_reranker_document_characters
            path: semantic.reranker_api.document_characters
            type: positive_int
            label: Reranker document characters
            description: Maximum Unicode characters per reranked chunk. Used only when a reranker is configured.
            default: 768
          - id: om.semantic_reranker_min_score
            path: semantic.reranker_api.min_score
            type: optional_finite_float
            label: Reranker min score
            description: Optional finite inclusive raw reranker score floor. Leave blank for no score filter.
            default: ''
