# Bundled AI provider catalog (authoritative for model presence; entries are complete).
# Copied to ~/.hatfield/ai-catalog.yaml on first run. providers:update rebases that
# user copy onto this default and syncs model metadata from models.dev.
# Connection settings (base_url/api/paths/auth) are NEVER taken from models.dev.
#
# Known-provider settings in ~/.hatfield or project .hatfield stay sparse:
#   ai.providers.zai: { enabled: true, api_key: env:ZAI_API_KEY }
# Refresh: hatfield providers:update
# Interactive setup: bin/console providers:setup (see providers-setup-command task)

version: 1

providers:
    deepseek:
        label: 'DeepSeek'
        kind: apikey
        type: generic
        enabled: false
        base_url: https://api.deepseek.com
        api: openai-completions
        completions_path: /chat/completions
        supports_completions: true
        supports_embeddings: false
        compatibility:
            thinking_format: deepseek
            requires_reasoning_content_on_assistant_messages: true
        auth_command: null
        models:
            deepseek-v4-pro:
                name: DeepSeek V4 Pro
                context_window: 1000000
                max_tokens: 384000
                input: [text]
                tool_calling: true
                reasoning: true
                thinking_level_map: { minimal: high, low: high, medium: high, high: high, xhigh: max }
                cost: { input: 0.435, output: 0.87, cache_read: 0.003625, cache_write: 0 }
            deepseek-v4-flash:
                name: DeepSeek V4 Flash
                context_window: 1000000
                max_tokens: 384000
                input: [text]
                tool_calling: true
                reasoning: true
                thinking_level_map: { minimal: high, low: high, medium: high, high: high, xhigh: max }
                cost: { input: 0.14, output: 0.28, cache_read: 0.0028, cache_write: 0 }

    zai:
        label: 'Z.ai (GLM)'
        kind: apikey
        type: generic
        enabled: false
        base_url: https://api.z.ai/api/coding/paas/v4
        api: openai-completions
        completions_path: /chat/completions
        supports_completions: true
        supports_embeddings: false
        compatibility:
            supports_developer_role: false
            supports_reasoning_effort: false
            thinking_format: zai
        auth_command: null
        models:
            glm-5.1:
                name: GLM 5.1
                context_window: 200000
                max_tokens: 131072
                input: [text]
                tool_calling: true
                reasoning: true
                thinking_level_map: { minimal: enabled, low: enabled, medium: enabled, high: enabled }
                compatibility: { zai_tool_stream: true }
                cost: { input: 0, output: 0, cache_read: 0, cache_write: 0 }
            glm-5v-turbo:
                name: GLM 5V Turbo
                context_window: 200000
                max_tokens: 131072
                input: [text, image]
                tool_calling: true
                reasoning: true
                thinking_level_map: { minimal: enabled, low: enabled, medium: enabled, high: enabled }
                compatibility: { zai_tool_stream: true }
                cost: { input: 0, output: 0, cache_read: 0, cache_write: 0 }
            glm-5.2:
                name: GLM 5.2
                context_window: 1000000
                max_tokens: 131072
                input: [text]
                tool_calling: true
                reasoning: true
                thinking_level_map: { minimal: null, low: high, medium: high, high: high, xhigh: max }
                compatibility: { supports_reasoning_effort: true, zai_tool_stream: true }
                cost: { input: 0, output: 0, cache_read: 0, cache_write: 0 }
            glm-5.3:
                name: GLM 5.3
                context_window: 1000000
                max_tokens: 131072
                input: [text]
                tool_calling: true
                reasoning: true
                thinking_level_map: { minimal: enabled, low: enabled, medium: enabled, high: enabled }
                compatibility: { zai_tool_stream: true }
                cost: { input: 0, output: 0, cache_read: 0, cache_write: 0 }

    openai-codex:
        label: 'OpenAI Codex'
        kind: oauth
        type: codex
        enabled: false
        base_url: https://chatgpt.com/backend-api
        api: openai-responses
        completions_path: /codex/responses
        supports_completions: true
        supports_embeddings: false
        supports_thinking_levels: true
        transport: websocket
        websocket_cache_idle_ttl_seconds: 300
        websocket_cache_max_age_seconds: 3300
        compatibility:
            supports_developer_role: false
            supports_reasoning_effort: false
            thinking_format: codex
        auth_command: 'auth:codex'
        models:
            gpt-5.6-luna:
                name: GPT-5.6 Luna
                reasoning: true
                thinking_level_map: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
                tool_calling: true
                input: [text, image]
                context_window: 272000
                max_tokens: 128000
                cost: { input: 1.00, output: 6.00, cache_read: 0.10, cache_write: 1.25 }
            gpt-5.6-sol:
                name: GPT-5.6 Sol
                reasoning: true
                thinking_level_map: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
                tool_calling: true
                input: [text, image]
                context_window: 272000
                max_tokens: 128000
                cost: { input: 5.00, output: 30.00, cache_read: 0.50, cache_write: 6.25 }
            gpt-5.6-terra:
                name: GPT-5.6 Terra
                reasoning: true
                thinking_level_map: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
                tool_calling: true
                input: [text, image]
                context_window: 272000
                max_tokens: 128000
                cost: { input: 2.50, output: 15.00, cache_read: 0.25, cache_write: 3.125 }

    grok-cli:
        label: 'Grok / xAI'
        kind: oauth
        type: grok
        enabled: false
        base_url: 'https://cli-chat-proxy.grok.com'
        api: openai-responses
        completions_path: /v1/responses
        supports_completions: true
        supports_embeddings: false
        supports_thinking_levels: true
        compatibility:
            supports_developer_role: false
        auth_command: 'auth:grok'
        models:
            grok-composer-2.5-fast:
                name: Composer 2.5 Fast (Grok CLI)
                reasoning: false
                thinking_level_map: { off: none, minimal: null, low: null, medium: null, high: null, xhigh: null }
                tool_calling: true
                input: [text, image]
                context_window: 200000
                max_tokens: 30000
                cost: { input: 3.00, output: 15.00, cache_read: 0.50, cache_write: 0 }
            grok-4.6:
                name: Grok 4.6
                reasoning: true
                tool_calling: true
                input: [text, image]
                context_window: 500000
                max_tokens: 30000
                cost: { input: 2.00, output: 6.00, cache_read: 0.50, cache_write: 0 }
