# Doctrine DBAL + ORM configuration for SQLite-backed storage.
#
# App/runtime ORM state lives in .hatfield/state.sqlite (CWD-relative; see
# Kernel app.cwd). Durable Messenger queues use the session-owned sqlite-queue
# broker under configured session storage, not a Doctrine transport connection.
#
# options key 2 = PDO::ATTR_TIMEOUT (seconds). SQLite maps this to PRAGMA
# busy_timeout (milliseconds = seconds × 1000), so 5 → 5000ms.
# BEGIN IMMEDIATE on the default connection makes competing app-state writers
# wait before taking a read snapshot instead of failing on read→write upgrade.
#
# ORM entities on the default connection:
#   - background_process  — BackgroundProcessManager durable tracking
#   - tool_batch_schedule — DoctrineToolBatchStore scheduling metadata
#

doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver: pdo_sqlite
                path: '%app.cwd%/.hatfield/state.sqlite'
                logging: false
                profiling: false
                options:
                    2: 5

    orm:
        # Native lazy objects are the default in DoctrineBundle 3.x
        # (replaces proxy generation from earlier versions).
        # enable_lazy_ghost_objects and auto_generate_proxy_classes
        # are removed/no-op in DoctrineBundle 3.x.
        enable_native_lazy_objects: true
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                mappings:
                    AgentCore\Infrastructure\Doctrine:
                        dir: '%kernel.project_dir%/src/AgentCore/Infrastructure/Doctrine'
                        prefix: 'Ineersa\AgentCore\Infrastructure\Doctrine'
                        type: attribute
                    CodingAgent\Entity:
                        dir: '%kernel.project_dir%/src/CodingAgent/Entity'
                        prefix: 'Ineersa\CodingAgent\Entity'
                        type: attribute
