# Messenger bus, transport, and routing configuration.
#
# Two buses:
#   agent.command.bus    — orchestration for StartRun/ApplyCommand and run results.
#                          Routed messages (StartRun, ApplyCommand,
#                          ApplyShellCommand, LlmStepResult,
#                          ToolCallResult, CompactionStepResult) are
#                          enqueued on run_control and handled only by the single run_control consumer,
#                          including the AdvanceRun and CompactRun state transitions.
#   agent.execution.bus  — async LLM/tool work. ExecuteLlmStep → llm transport,
#                          ExecuteToolCall → tool transport. Workers consume from
#                          their respective queues and dispatch results back to
#                          agent.command.bus within the same consumer process.
#
# Async transports use the session-owned sqlite-queue broker. The parent
# process publishes HATFIELD_*_TRANSPORT_DSN plus broker database/endpoint
# env before spawning the controller. App/runtime ORM state stays on
# Doctrine connection "default" (.hatfield/state.sqlite). See doctrine.yaml.
#
# After ASYNC-05:
# - StartRun → run_control transport (messenger:consume run_control)
# - ApplyCommand → run_control transport
# - ApplyShellCommand → run_control transport
# - AdvanceRun and CompactRun → run_control transport. StepDispatcher sends these
#   state transitions to agent.command.bus; only external-I/O Execute* effects use
#   agent.execution.bus.
# - ExecuteLlmStep → llm transport (messenger:consume llm)
# - ExecuteToolCall → tool transport (messenger:consume tool)
# - ExecuteToolCall (toolName=subagent) → agent transport via
#   SubagentExecuteToolCallRoutingMiddleware (messenger:consume agent)
# - McpInitializeSessionCommand → mcp transport (messenger:consume mcp)
#   MCP lifecycle messages are routed to the dedicated mcp consumer (Phase 1).
# - Result messages (LlmStepResult, ToolCallResult, CompactionStepResult) route
#   to run_control so execution workers enqueue results instead of mutating
#   RunStore/EventStore/tool-batch state in llm/tool consumer processes.
#   RunOrchestrator handlers run when the run_control consumer receives them.
#
# Transient streaming deltas (thinking, text, tool-call arguments) are
# delivered via STDOUT from the LLM consumer child process. The controller
# reads the child's stdout pipe and forwards events to the TUI. No
# sqlite-queue publish transport is needed.
#
# run_control transport uses PhpSerializer because StartRun contains complex
# objects (StartRunPayload with AgentMessage[] and RunMetadata) that would
# not round-trip correctly through the default Symfony Serializer.

parameters:
    env(HATFIELD_AGENT_TRANSPORT_DSN): 'sync://'
    env(HATFIELD_MCP_TRANSPORT_DSN): 'in-memory://'
    env(HATFIELD_EXTENSION_AGENT_TRANSPORT_DSN): 'sync://'
# Requests carry immutable DTO inputs; child launch inputs remain file references.

framework:
    messenger:
        default_bus: agent.command.bus
        buses:
            agent.command.bus:
                middleware:
                    - Ineersa\CodingAgent\Runtime\Messenger\OwnerRunInitializationMiddleware
                    # The owner lock and pending-transition recovery precede body admission.
                    - Ineersa\CodingAgent\Runtime\Messenger\ToolPayloadMiddleware
                default_middleware:
                    enabled: true
                    allow_no_handlers: false
                    allow_no_senders: true
            agent.execution.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: false
                    allow_no_senders: true
                middleware:
                    # Subagent tool routing: stamps toolName=subagent|agent_resume
                    # with TransportNamesStamp(['agent']) before default YAML routes
                    # ExecuteToolCall to tool. fork stays on tool. Runs before MCP middleware.
                    - Ineersa\CodingAgent\Agent\Messenger\SubagentExecuteToolCallRoutingMiddleware
                    # MCP-aware routing: stamps MCP-backed ExecuteToolCall with
                    # TransportNamesStamp(['mcp']) so send_message routes to the
                    # single mcp consumer instead of the default tool transport.
                    # Runs before Symfony send_message middleware.
                    - Ineersa\CodingAgent\Mcp\Messenger\McpExecuteToolCallRoutingMiddleware
                    # Routing sees toolName first; only bounded references reach send_message.
                    - Ineersa\CodingAgent\Runtime\Messenger\ToolPayloadMiddleware

        transports:
            run_control:
                dsn: '%env(HATFIELD_RUN_CONTROL_TRANSPORT_DSN)%'
                serializer: 'messenger.transport.native_php_serializer'
            llm:
                dsn: '%env(HATFIELD_LLM_TRANSPORT_DSN)%'
                serializer: 'messenger.transport.native_php_serializer'
            tool:
                dsn: '%env(HATFIELD_TOOL_TRANSPORT_DSN)%'
                serializer: 'messenger.transport.native_php_serializer'
            agent:       '%env(HATFIELD_AGENT_TRANSPORT_DSN)%'
            mcp:         '%env(HATFIELD_MCP_TRANSPORT_DSN)%'
            # Dedicated async worker for extension-owned agent jobs (Observer, etc.).
            # Uses default Symfony Serializer (scalar/array payload only).
            # MUST be a process transport (sqlite-queue:// / in-memory:// for tests).
            # ExtensionAgentJobDispatcher refuses sync:// so model work cannot run
            # inline during AfterTurnCommit / on the caller thread.
            # Uses Symfony Messenger native default max_retries (3). No failure_transport:
            # exhausted jobs emit a TUI runtime event instead of a dead-letter queue.
            extension_agent:
                dsn: '%env(HATFIELD_EXTENSION_AGENT_TRANSPORT_DSN)%'

        routing:
            Ineersa\CodingAgent\Application\Message\DTO\RegisterDeferredInvocationDTO: run_control
            Ineersa\CodingAgent\Application\Message\DTO\RecordChildLaunchSuccessDTO: run_control
            Ineersa\CodingAgent\Application\Message\DTO\RecordChildLaunchFailureDTO: run_control
            Ineersa\CodingAgent\Application\Message\DTO\ReadyCodeModeInvocationDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\BashProcessCommandDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\RequestBashBackgroundDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\BashOwnershipCommandDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\RegisterBashProcessCommandDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\BashProcessStartedDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\BashProcessFinishedDTO: run_control
            Ineersa\CodingAgent\Application\BackgroundProcess\DTO\BashProcessAcceptedDTO: run_control
            # ToolPayloadMiddleware selects tool/agent/mcp/run_control through
            # TransportNamesStamp. Inline tool messages have no fallback route.
            Ineersa\CodingAgent\Application\Message\DTO\BackgroundChildInvocationDTO: run_control
            Ineersa\CodingAgent\Application\Message\DTO\BackgroundCodeModeInvocationDTO: run_control
            Ineersa\CodingAgent\Application\Message\DTO\DeliverBackgroundCompletionDTO: run_control
            Ineersa\CodingAgent\Application\AgentCommunication\DTO\AcceptSubmissionDTO: run_control
            Ineersa\CodingAgent\Application\AgentCommunication\DTO\CompleteSubmissionDTO: run_control
            Ineersa\CodingAgent\Application\AgentCommunication\DTO\DeliverSubmissionDTO: run_control
            Ineersa\CodingAgent\Application\Message\AttachRun: run_control
            Ineersa\CodingAgent\Application\Message\SelectHistoryEntry: run_control
            Ineersa\CodingAgent\Application\Message\RepairSession: run_control
            Ineersa\AgentCore\Domain\Message\StartRun: run_control
            Ineersa\AgentCore\Domain\Message\ApplyCommand: run_control
            Ineersa\AgentCore\Domain\Message\ApplyShellCommand: run_control
            Ineersa\AgentCore\Domain\Message\LlmStepResult: run_control
            Ineersa\AgentCore\Domain\Message\CommitSubagentProgress: run_control
            Ineersa\AgentCore\Domain\Message\CompactionStepResult: run_control
            Ineersa\CodingAgent\Agent\Execution\Subagent\Batch\Deferred\Observation\ObserveDeferredSubagentBatchChildTurnMessage: run_control
            Ineersa\CodingAgent\Agent\Execution\Subagent\Batch\Deferred\Lifecycle\DeliverDeferredSubagentBatchLifecycleMessage: run_control
            Ineersa\CodingAgent\Agent\Execution\Subagent\Batch\Deferred\Interruption\InterruptDeferredSubagentBatchMessage: run_control
            Ineersa\CodingAgent\Agent\Execution\Subagent\Batch\Deferred\Recovery\RecoverDeferredSubagentBatchLifecycleMessage: run_control

            # State transitions are sent only to agent.command.bus by
            # StepDispatcher and are durably handled once by run_control.
            # Their asynchronous work remains separate Execute* effects.
            Ineersa\AgentCore\Domain\Message\AdvanceRun: run_control
            Ineersa\AgentCore\Domain\Message\CompactRun: run_control
            # Default tool transport; subagent is overridden to agent via middleware.
            Ineersa\AgentCore\Domain\Message\ExecuteLlmStep: llm
            Ineersa\AgentCore\Domain\Message\ExecuteCompactionStep: llm
            Ineersa\CodingAgent\Mcp\Message\McpInitializeSessionCommand: mcp
            Ineersa\CodingAgent\Mcp\Message\McpRefreshCatalogCommand: mcp
            Ineersa\CodingAgent\Mcp\Message\McpDisconnectSessionCommand: mcp
            # Generic extension-agent jobs only — no OM-specific message classes.
            Ineersa\CodingAgent\Extension\Agent\ExtensionAgentJobMessage: extension_agent
