# Hatfield built-in defaults.
#
# These are the base settings shipped with the application.
# They can be overridden by:
#   1. ~/.hatfield/settings.yaml  (global user settings)
#   2. <project>/.hatfield/settings.yaml  (project-local settings)
#
# Precedence: defaults < home < project
#
# Environment variables (read at process startup, not from YAML):
#   HATFIELD_CAPTURE_ERRORS=1  (default)  Convert caught exceptions to
#                               user-visible runtime/TUI errors.
#   HATFIELD_CAPTURE_ERRORS=0             Crash/rethrow on errors —
#                               for test harnesses that need loud failures.
#
# Path placeholders supported:
#   %kernel.project_dir%  App installation directory
#   ~                     Home directory
#   relative paths        Resolved against the settings file's containing directory

tui:
    theme: cyberpunk
    theme_paths:
        - '%kernel.project_dir%/config/themes'
        - '.hatfield/themes'
        - '~/.hatfield/themes'

    # Transcript display settings.
    # Preview expansion is TUI-session-only and not persisted.
    transcript:
        thinking:
            # Whether assistant thinking content is visible in the transcript.
            visible: true
            # Visual style for visible thinking (e.g. 'dim_italic').
            style: dim_italic
        previews:
            # Whether previewable blocks (tool results, diffs) start expanded.
            expanded_by_default: false
            # Max lines shown for normal tool result previews.
            tool_result_lines: 8
            # Max lines shown for diff-rendered tool result previews.
            diff_lines: 20

sessions:
    path: '.hatfield/sessions'

# ---------------------------------------------------------------------------
# Compaction
# ---------------------------------------------------------------------------
#
# Compaction replaces older conversation history with a concise handoff summary
# while keeping the most recent messages raw. Manual /compact is always available.
# Auto-compaction triggers when the estimated context exceeds compact_after_tokens.
#
# Per-provider and per-model overrides win over global settings.
# Provider overrides use provider IDs (e.g. openai, llama_cpp).
# Model overrides use provider/model keys (e.g. openai/gpt-4.1).
#
compaction:
    # Controls auto-compaction only. Manual /compact is always available.
    auto_enabled: true

    # Flat token threshold for auto-compaction trigger.
    compact_after_tokens: 120000

    # Approximate number of newest tokens to retain raw after compaction.
    # Messages are kept whole — the cut never splits a message, so the actual
    # retained token count may exceed this target when the nearest safe boundary
    # is further back.
    keep_recent_tokens: 20000

    # Summarization model override. Format: provider/model (e.g. llama_cpp/flash).
    # When null, the active session model is used for summarization.
    model: null

    # Thinking/reasoning level for summarization calls.
    # When null, the session's active thinking level is used.
    thinking_level: null

    # Per-provider override settings.
    # Each entry can set: compact_after_tokens, model, thinking_level.
    # provider_overrides:
    #     openai:
    #         compact_after_tokens: 120000
    #         model: openai/gpt-4.1-mini
    #         thinking_level: low

    # Per-model override settings (wins over provider, which wins over global).
    # Each entry can set: compact_after_tokens, model, thinking_level.
    # model_overrides:
    #     openai/gpt-4.1:
    #         compact_after_tokens: 140000
    #         model: openai/gpt-4.1-mini
    #         thinking_level: off

# ---------------------------------------------------------------------------
# Context-budget wrap-up reminders (transient system guidance)
# ---------------------------------------------------------------------------
#
# One-shot wrap-up reminders after committed llm_step_completed (parent/fork/subagent).
# CodingAgent after-turn hook queues a user append_message wrapped in
# <system-reminder>...</system-reminder> via AgentRunner::appendMessage.
#
# Metric: that response's provider-reported input_tokens / prompt_tokens.
# Remaining = context_window - current_response_input.
# One-shot/reset uses existing agent_command_queued/applied + context_compacted.
# Missing positive usage or context-window metadata => no reminder.
#
context_budget_reminders:
    # Early advisory once prompt/input usage reaches this absolute size.
    early_input_tokens: 200000

    # Urgent wrap-up when remaining context drops strictly below this (sole reserve).
    urgent_remaining_tokens: 25000

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
#
# Tool execution defaults control scheduling policy and timeout metadata.
# Output capping persists oversized text output under tools.output_cap.path and
# replaces it with a model-facing capped notice containing inspection hints.
#
# Override any value here in your home or project settings.
#
tools:
    execution:
        # Default execution mode: sequential (one tool at a time) or parallel.
        # Parallel mode requires TOOLS-R05 / multi-consumer tool dispatch.
        default_mode: sequential

        # No global tool timeout setting. Potentially blocking tools must own and enforce
        # their own deadline (Bash tools.bash.*, subagent agents.subagent_tool_timeout_seconds,
        # MCP transport timeout, per-tool ToolDefinitionDTO/ToolRegistrationDTO budgets).
        # ToolExecutor never rewrites a successful late result into a timeout failure.

        # Maximum parallelism: how many tool calls to run concurrently.
        # Also controls the number of parallel messenger:consume tool
        # worker processes launched by the controller.
        max_parallelism: 4

        # Execution mode per tool is set at registration time by the tool
        # author/provider in ToolDefinitionDTO, not from settings overrides.
        # File-mutation tools (write, edit) are explicitly registered as
        # Sequential in their HatfieldToolProviderInterface::definition().

    image:
        # Maximum image file size in bytes (default: 10 MB).
        max_bytes: 10485760

        # Maximum image width in pixels (rejection limit).
        max_width: 4096

        # Maximum image height in pixels (rejection limit).
        max_height: 2000

        # Maximum pixel dimension for resize-to-fit (default: 2000).
        # Images exceeding this are scaled down to fit within a
        # max_dimension × max_dimension bounding box, preserving aspect
        # ratio. This is the resize target, not a rejection limit.
        max_dimension: 2000

        # Maximum allowed base64-encoded payload length in bytes.
        # Default 4.5 MiB — safe below Anthropic and OpenAI 5 MiB limits.
        # The processor reduces quality and/or dimensions to stay under
        # this limit.
        encoded_max_bytes: 4718592

        # Starting JPEG/WebP compression quality (1–100).
        jpeg_quality: 80

        # Minimum JPEG/WebP quality the processor may attempt (1–100).
        # The processor descends from jpeg_quality down to this minimum
        # in steps of ~15 before reducing dimensions.
        jpeg_min_quality: 40

    output_cap:
        # Storage root for ephemeral run-scoped oversized output. Each run uses
        # a SHA-256-derived child directory; relative paths resolve against CWD.
        path: .hatfield/tmp/output-cap

        # Default character cap for non-doc paths (code files).
        default_cap: 20000

        # Character cap for doc-like paths (.md, .txt, .toon).
        doc_cap: 50000

        # Orphan fallback retention in seconds (default 24 hours). Controller
        # session lifecycle cleanup removes owned artifacts earlier.
        retention: 86400

        # Optional session prefix for persisted output filenames.
        # session_prefix: run-abc123

    background_process:
        # Storage directory for background process log files.
        # Relative paths resolve against the active project CWD.
        path: .hatfield/tmp/bg

        # Grace period in seconds for SIGTERM before SIGKILL on stop.
        stop_grace_seconds: 5

        # Maximum characters returned by bg_status log action.
        log_tail_chars: 5000

    bash:
        # Default timeout in seconds for bash commands.
        default_timeout_seconds: 300

        # Maximum allowed timeout that a model can request.
        # Timeouts above this are rejected with a validation error.
        max_timeout_seconds: 3600

        # Seconds before the bash tool asks whether to move a still-running
        # command to background. TOOLS-09 default declines; TOOLS-09B wires
        # this to the TUI question system.
        background_prompt_threshold_seconds: 15

        # Supervision loop poll interval in microseconds.
        poll_interval_micros: 100000

        # Maximum characters to read from the background process log
        # for returning as final/partial command output.
        log_tail_chars: 20000

# ---------------------------------------------------------------------------
# Extensions
# ---------------------------------------------------------------------------
#
# Hatfield supports in-process PHP extensions that can register tools and
# integrate with the agent runtime. Extensions must implement
# Ineersa\Hatfield\ExtensionApi\HatfieldExtensionInterface.
#
# Extensions installed via Composer under .hatfield/extensions/vendor/ are
# autoloaded automatically at startup when the extensions.enabled list is
# non-empty.
#
# To enable an extension, add its fully-qualified class name to the list:
#
#   extensions:
#       enabled:
#           - Acme\HatfieldTaskWorkflow\TaskWorkflowExtension
#
# The list is empty by default — no extensions are loaded unless explicitly
# enabled.
#
extensions:
    enabled:
        - Ineersa\CodingAgent\Extension\Builtin\SafeGuard\SafeGuardExtension

    # Generic extension settings exposed via the Extension API.
    # Each extension reads its own section by key.
    #
    # SafeGuard settings (key: 'safe_guard'):
    #
    # Hard-blocked operations (never negotiable):
    #   - sudo / privilege escalation
    #
    # Dangerous commands (can be allowlisted via allow_command_patterns):
    #   rm, rmdir, git clean, git reset --hard, git checkout -- .,
    #   mkfs, dd if=, chmod 777, chown -R, mv ... /dev/null
    #
    # Dangerous git (can be allowlisted):
    #   git push --force/-f, git branch -d/-D, git tag -d,
    #   git rebase, git reflog expire
    #
    # Sensitive info exposure (can be allowlisted):
    #   env, printenv (and piped variants)
    #
    # Protected read patterns are additive on top of built-in defaults:
    #   .env.local, auth.json, .ssh/id_*, .aws/credentials,
    #   .kube/config, *.pem, *.key, service-account files
    #
    # Writes/edits outside the current working directory (can be allowlisted).
    #
    settings:
        safe_guard:
            # Tool names used for matching (configurable to support custom tool aliases).
            tool_names:
                bash: bash
                write: write
                edit: edit
                read: read
                settings: settings

            # Command substrings that bypass destructive/dangerous checks.
            allow_command_patterns: []

            # Absolute paths where writes outside CWD are always allowed.
            allow_write_outside_cwd: []

            # Additional filename/path patterns that require confirmation to read.
            # These are added on top of the built-in defaults (which cannot be removed).
            protected_read_patterns: []

            # Extra command substrings to treat as dangerous (added to built-in regexes).
            dangerous_command_patterns: []

            # When true and running without a TUI/controller (e.g., headless or
            # messenger worker), return Block instead of RequireApproval for
            # policy-relaxable categories. Set to false for controller-mode testing.
            auto_deny_in_noninteractive: true

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
#
# Controls application logging to .hatfield/logs/.
# Logs use JSONL format with daily rotation (one file per day).
#
logging:
    # Log storage directory. Relative paths resolve against the active
    # project CWD. Supports ~ (home) and %kernel.project_dir%.
    path: .hatfield/logs

    # Minimum log level. PSR-3 level names (lowercase):
    #   debug, info, notice, warning, error, critical, alert, emergency
    level: info

    # Number of daily rotated log files to retain before deletion.
    max_files: 14

# ---------------------------------------------------------------------------
# Prompt templates
# ---------------------------------------------------------------------------
# Prompt templates are Markdown files invoked with /name, where name is the
# filename without .md. Auto-discovery scans these non-recursive directories:
#   ~/.hatfield/prompts/*.md
#   <cwd>/.hatfield/prompts/*.md
#
# Add extra template files or directories here. Paths support ~,
# %kernel.project_dir%, and relative paths. Relative paths resolve against
# the project working directory (CWD).
#
# Example:
# prompts:
#   - '.hatfield/team-prompts'
#   - '~/shared/prompts/review.md'
prompts: []

# ---------------------------------------------------------------------------
# Agent definitions
# ---------------------------------------------------------------------------
#
# Controller runtime process knobs (not tool policy).
# Distinct from tools.execution.max_parallelism (tool workers) and agents.max_agents
# (how many children a single subagent tool call may request).
runtime:
    # Fixed pool of messenger:consume llm workers launched by HeadlessController.
    # Bounded 1..8 via Symfony Validator attributes on RuntimeConfig. Default 4
    # enables overlapping provider calls for parallel subagents without dynamic
    # per-batch spawning.
    llm_worker_count: 4

# Agent definitions configure named child-agent roles for your project or user
# environment. For example, you can define agents named scout, reviewer,
# researcher, worker, or any custom name. Each definition is a Markdown file
# with YAML frontmatter discovered from the locations below in deterministic
# order (load order is lowest to highest; later layers override earlier by name).
#
# Discovery load order (lowest to highest):
#   1. User agents under ~/.agents/*.md
#   2. Project agents under .agents/*.md
#   3. User agents under ~/.hatfield/agents/*.md
#   4. Project agents under .hatfield/agents/*.md
#   5. Configured agents.paths (highest precedence)
#
# Directories are scanned non-recursively for *.md files. Configured paths
# may be a single .md file or a directory of *.md files.
# Every valid discovered definition is launchable; remove one by deleting/moving its file.
#
agents:
    # Whether agent discovery is enabled.
    enabled: true

    # Durable deferred-batch deadline (seconds) for foreground subagent tool execution.
    # Schedules timeout interruption (DelayStamp + InterruptDeferredSubagentBatchMessage).
    # Not the generic ToolExecutor timeout (the subagent tool has no ToolExecutor cap).
    # Default: 86400 (24 hours). Minimum 60; values below 60 are rejected at load.
    # subagent_tool_timeout_seconds: 2400

    # Tool names always excluded from child/subagent runs (inherit-all and explicit lists).
    # Empty list disables the denylist. Parent agent tools are unaffected.
    subagent_excluded_tools:
        - settings
        - hatfield_docs

    # Child-run extension selection for subagents.
    # Effective allowlist = always_on ∪ agent frontmatter `extensions` (stable first-seen).
    # Omitted frontmatter extensions means no optional child extensions — never inherits
    # optional entries from global extensions.enabled.
    extensions:
        always_on:
            - Ineersa\CodingAgent\Extension\Builtin\SafeGuard\SafeGuardExtension

    # Additional explicit agent definition file or directory paths.
    # These have the highest precedence (override all auto-discovery).
    # Example:
    # paths:
    #     - ~/shared/agents/custom-reviewer.md
    #     - .hatfield/team-agents
    paths: []

# ---------------------------------------------------------------------------
# AI provider and model configuration
# ---------------------------------------------------------------------------
#
# Known-provider catalogs (connection settings, quirks, full model lists) ship in
# config/ai-catalog.yaml (bundled default). First load copies that file to
# ~/.hatfield/ai-catalog.yaml; runtime reads the user copy. `hatfield providers:update`
# rebases the user catalog onto the bundled default and syncs models.dev metadata.
# Interactive enablement: `bin/console providers:setup` (see providers-setup-command).
#
# User/project settings stay sparse overlays for known providers, for example:
#   ai:
#       default_model: zai/glm-5.3
#       providers:
#           zai:
#               enabled: true
#               api_key: env:ZAI_API_KEY
# Custom/local providers (llama.cpp, RunPod, …) remain full definitions under
# ai.providers in settings — they are not gated by the catalog.
#

forks:
    model: null
    thinking_level: null
    # Child-run extension selection for forks.
    # Effective allowlist = always_on ∪ enabled (stable first-seen).
    # Does not inherit optional entries from global extensions.enabled.
    extensions:
        always_on:
            - Ineersa\CodingAgent\Extension\Builtin\SafeGuard\SafeGuardExtension
        enabled: []
