# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
imports:
  - { resource: services/chatgpt.yaml }

parameters:
    # Default HATFIELD_CAPTURE_ERRORS to enabled; overridable via env var.
    env(HATFIELD_CAPTURE_ERRORS): '1'

    # app.capture_errors resolves the env var as a boolean.
    # Services read this parameter — not the raw env directly.
    app.capture_errors: '%env(bool:HATFIELD_CAPTURE_ERRORS)%'

    # Prompt-cache structural diagnostics are opt-in because they append one sidecar
    # record per shaped provider request. This is not provider cache or replay state.
    env(HATFIELD_WRITE_PROMPT_CACHE_DIAGNOSTICS): '0'

    app.write_prompt_cache_diagnostics: '%env(bool:HATFIELD_WRITE_PROMPT_CACHE_DIAGNOSTICS)%'

    # Controller session ID for background process polling and maintenance.
    # Empty disables both in non-controller or test environments. The controller
    # environment supplies the actual run ID so queries stay within owned runs.
    env(HATFIELD_SESSION_ID): ''

    # Context-gate committed RuntimeEvent stdout streaming (not per-consumer selection).
    # Default off for in-process TUI, tests, and non-supervised contexts; ConsumerSupervisor sets '1'
    # on env for every messenger:consume subprocess it launches.
    env(HATFIELD_CONSUMER_STDOUT_EVENTS): '0'

    # Opt-in session resource sampler for castor run:agent only.
    # Normal binary/PHAR launches leave this unset/false and never schedule sampling.
    env(HATFIELD_SESSION_RESOURCE_SAMPLER): '0'
    env(HATFIELD_TELEMETRY_ENV): 'dev'
    env(HATFIELD_DOGSTATSD_HOST): '127.0.0.1'
    env(HATFIELD_DOGSTATSD_PORT): '8125'
    app.session_resource_sampler.enabled: '%env(bool:HATFIELD_SESSION_RESOURCE_SAMPLER)%'
    app.telemetry_env: '%env(string:HATFIELD_TELEMETRY_ENV)%'
    app.dogstatsd.host: '%env(string:HATFIELD_DOGSTATSD_HOST)%'
    app.dogstatsd.port: '%env(int:HATFIELD_DOGSTATSD_PORT)%'

    # Single source of truth for the file mention completion index path.
    # Built from %app.cwd% so it respects --cwd.  Injected into
    # FileMentionIndexReader and CompletionFileIndexRefreshCommand
    # to avoid path duplication.
    app.file_mention_index_path: '%app.cwd%/.hatfield/cache/file-mentions/index.jsonl'

    # Controller single-owner flock root. Must follow %app.cwd% (project), not
    # kernel.project_dir, so source/worktree/PHAR installs share one OS lock path.
    hatfield.controller.session_owner_lock_dir: '%app.cwd%/.hatfield/tmp/controller-locks'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Ineersa\Tui\ImagePaste\ClipboardImageReaderInterface: '@Ineersa\Tui\ImagePaste\ClipboardImageReader'

  _instanceof:
    Ineersa\Tui\Listener\TuiListenerRegistrar:
      tags: ['app.tui_listener']

    Ineersa\Tui\Listener\SlashCommandCatalogRegistrar:
      tags: ['app.slash_command_catalog']

    Ineersa\AgentCore\Contract\Hook\BeforeProviderRequestHookInterface:
      tags: ['agent_core.before_provider_request_hook']

    Ineersa\AgentCore\Contract\Tool\ToolResultProcessorInterface:
      tags: ['agent_core.tool_result_processor']

    Ineersa\AgentCore\Application\Pipeline\RunMessageHandler:
      tags: ['agent_core.run_message_handler']

    Ineersa\AgentCore\Contract\CoordinationActionValidatorInterface:
      tags: ['agent_core.coordination_action_validator']

    Ineersa\AgentCore\Contract\CommandConsumptionPolicyInterface:
      tags: ['agent_core.command_consumption_policy']

    Ineersa\AgentCore\Contract\Extension\CommandHandlerInterface:
      tags: ['agent_core.command_handler']

    Ineersa\AgentCore\Contract\Extension\HookSubscriberInterface:
      tags: ['agent_core.hook_subscriber']

    Ineersa\AgentCore\Contract\Extension\EssentialAfterTurnHookInterface:
      tags: ['agent_core.hook_subscriber']

    Ineersa\AgentCore\Contract\Hook\TransformContextHookInterface:
      tags: ['agent_core.transform_context_hook']

    Ineersa\AgentCore\Contract\Hook\ConvertToLlmHookInterface:
      tags: ['agent_core.convert_to_llm_hook']

    Ineersa\CodingAgent\Compaction\BeforeCompactionHookInterface:
      tags: ['coding_agent.before_compaction_hook']

    # Built-in tool providers are auto-collected by ToolRegistry
    # for permanent registration during registry construction.
    Ineersa\CodingAgent\Tool\HatfieldToolProviderInterface:
      tags: ['hatfield.tool_provider']

    Ineersa\CodingAgent\Infrastructure\SymfonyAi\SymfonyAiProviderBuilderInterface:
      tags: ['hatfield.symfony_ai.provider_builder']

  Ineersa\CodingAgent\:
    resource: '%kernel.project_dir%/src/CodingAgent/**/*.php'
    exclude:
      - '%kernel.project_dir%/src/CodingAgent/Tool/CodeMode/Resources/'

  Ineersa\CodingAgent\Agent\Diagnostics\PromptCacheDiagnosticsInvocationSubscriber:
    arguments:
      $writeDiagnostics: '%app.write_prompt_cache_diagnostics%'

  Ineersa\AgentCore\:
    resource: '%kernel.project_dir%/src/AgentCore/**/*.php'

  Ineersa\Tui\:
    resource: '%kernel.project_dir%/src/Tui/**/*.php'


  Ineersa\AgentCore\Contract\Tool\DeferredToolCompletionRepositoryInterface:
    alias: Ineersa\CodingAgent\Entity\DeferredToolCompletionRepository

  Ineersa\AgentCore\Contract\RunOperationalStatusReaderInterface:
    alias: Ineersa\CodingAgent\Repository\RunOperationalProjectionRepository

  # ─── Error capture (env-driven config, not a per-catch delegation service) ───

  Ineersa\CodingAgent\Runtime\Contract\RuntimeErrorCaptureConfig:
    arguments:
      $captureErrors: '%app.capture_errors%'

  # Provider quota probes for /usage.
  # Dedicated bounded HttpClient (no LLM retry decorator) so 401/429 stay visible.
  # HttpClient::create() selects Curl/Amp/Native transport the same way app code does.
  Ineersa\CodingAgent\Infrastructure\ProviderQuota\ProviderQuotaProbeService.http_client:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
    arguments:
      $defaultOptions:
        timeout: 15
        max_duration: 15

  Ineersa\CodingAgent\Infrastructure\ProviderQuota\ProviderQuotaProbeService:
    arguments:
      $appConfig: '@Ineersa\CodingAgent\Config\AppConfig'
      $httpClient: '@Ineersa\CodingAgent\Infrastructure\ProviderQuota\ProviderQuotaProbeService.http_client'
      $logger: '@Psr\Log\LoggerInterface'

  # Cooperative Amp transport for LLM provider HTTP. Curl remains the default
  # HttpClient::create() choice on this host and does not overlap inside fibers.
  # Cancellation wrapping stays in SymfonyAiProviderFactory::getHttpClient().
  Ineersa\CodingAgent\Infrastructure\SymfonyAi\llm.http_client:
    class: Symfony\Component\HttpClient\AmpHttpClient

  Ineersa\CodingAgent\Infrastructure\SymfonyAi\SymfonyAiProviderFactory:
    arguments:
      $builders: !tagged_iterator hatfield.symfony_ai.provider_builder
      $httpClient: '@Ineersa\CodingAgent\Infrastructure\SymfonyAi\llm.http_client'

  # ─── Hatfield config services ───

  Ineersa\CodingAgent\Config\AppResourceLocator:
    arguments:
      $appRoot: '%kernel.project_dir%'

  Ineersa\CodingAgent\Config\SettingsPathResolver:
    arguments:
      $appRoot: '%kernel.project_dir%'

  Ineersa\CodingAgent\Config\Ai\AiCatalog:
    arguments:
      $catalogPath: '@=service("Ineersa\\CodingAgent\\Config\\AppResourceLocator").getAiCatalogPath()'
      $homeDir: '@=service("Ineersa\\CodingAgent\\Config\\SettingsPathResolver").getHomeDir()'

  # Provenance path queries need THROW_ON_INVALID_INDEX so isReadable()
  # distinguishes missing keys from explicit null. FrameworkBundle's shared
  # @property_accessor is non-strict by default and would report missing array
  # indices as readable, falsely attributing every path to Project.
  coding_agent.settings.property_accessor_builder:
    class: Symfony\Component\PropertyAccess\PropertyAccessorBuilder
    calls:
      - enableExceptionOnInvalidIndex: []

  coding_agent.settings.property_accessor:
    class: Symfony\Component\PropertyAccess\PropertyAccessor
    factory: ['@coding_agent.settings.property_accessor_builder', 'getPropertyAccessor']

  # Dedicated strict accessor: provenance needs missing-index detection.
  Ineersa\CodingAgent\Config\SettingsValueResolver:
    arguments:
      $propertyAccessor: '@coding_agent.settings.property_accessor'

  Symfony\Component\Filesystem\Filesystem: ~

  Ineersa\CodingAgent\Application\BackgroundProcess\BashRegistrationReplyPublisher:
    arguments:
      $endpoint: '%env(HATFIELD_SQLITE_QUEUE_ENDPOINT)%'
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  Ineersa\CodingAgent\Application\BackgroundProcess\RegisterBashProcessHandler:
    arguments:
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  Ineersa\CodingAgent\Application\BackgroundProcess\ChangeBashOwnershipHandler:
    arguments:
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  Ineersa\CodingAgent\Application\BackgroundProcess\BashLifecycleFailureSubscriber:
    arguments:
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  Ineersa\CodingAgent\Application\BackgroundProcess\BashRegistrationClient:
    arguments:
      $commandBus: '@agent.command.bus'
      $endpoint: '%env(HATFIELD_SQLITE_QUEUE_ENDPOINT)%'
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  Ineersa\CodingAgent\Config\SettingsOverrideWriter:
    arguments:
      $propertyAccessor: '@coding_agent.settings.property_accessor'
      $filesystem: '@Symfony\Component\Filesystem\Filesystem'

  Ineersa\CodingAgent\Auth\GrokAuthStorage:
    arguments:
      $homeDir: '@=service("Ineersa\\CodingAgent\\Config\\SettingsPathResolver").getHomeDir()'


  # AppConfig is a value object, not an autowireable service.
  # The container uses the fromContainer() factory to construct it.
  # Canonical runtime cwd is injected from %app.cwd% rather than relying
  # on ambient getcwd(), ensuring all config services use the same canonical
  # runtime working directory (resolved from HATFIELD_CWD or kernel.project_dir).
  Ineersa\CodingAgent\Config\AppConfig:
    factory: ['Ineersa\CodingAgent\Config\AppConfig', 'fromContainer']
    arguments:
      $loader: '@Ineersa\CodingAgent\Config\AppConfigLoader'
      $resources: '@Ineersa\CodingAgent\Config\AppResourceLocator'
      $denormalizer: '@Symfony\Component\Serializer\SerializerInterface'
      $cwd: '%app.cwd%'
      $validator: '@validator'

  Ineersa\CodingAgent\Config\CompactionConfig:
    factory: ['Ineersa\CodingAgent\Config\CompactionConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  Ineersa\CodingAgent\Config\ForksConfigDTO:
    factory: ['Ineersa\CodingAgent\Config\ForksConfigDTO', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # ─── Prompt Templates ───

  Ineersa\CodingAgent\Config\PromptsConfig:
    factory: ['Ineersa\CodingAgent\Config\PromptsConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # ─── Agent Definitions ───

  Ineersa\CodingAgent\Config\AgentsConfig:
    factory: ['Ineersa\CodingAgent\Config\AgentsConfig', 'fromAppConfig']

  Ineersa\CodingAgent\Agent\Definition\AgentDefinitionDiscovery:
    arguments:
      $cwd: '%app.cwd%'

  Ineersa\CodingAgent\Agent\Definition\AgentDefinitionCatalog:
    factory: ['@Ineersa\CodingAgent\Agent\Definition\AgentDefinitionDiscovery', 'discover']

  Ineersa\CodingAgent\PromptTemplate\PromptTemplateLoader:
    arguments:
      $promptsConfig: '@Ineersa\CodingAgent\Config\PromptsConfig'
      $runtimeConfig: '@Ineersa\CodingAgent\PromptTemplate\PromptTemplatesRuntimeConfig'
      $cwd: '%app.cwd%'

  # ─── Extension wiring ───

  Ineersa\Tui\Extension\TuiCommandRegistryAdapter:
    arguments:
      $commandCatalog: '@Ineersa\Tui\Command\SlashCommandCatalog'

  Ineersa\Hatfield\ExtensionApi\Command\CommandRegistryInterface:
    alias: Ineersa\Tui\Extension\TuiCommandRegistryAdapter

  # Lazy: ExtensionManager (and thus ChildExtensionSelectionService / fork+
  # subagent launch builders) must not force-construct the AI Platform graph
  # when only validating child extension selection. Bridge is only needed when
  # extensions actually register tools/hooks via loadExtensions().
  Ineersa\CodingAgent\Extension\ExtensionToolRegistryBridge:
    lazy: true
    arguments:
      $appConfig: '@Ineersa\CodingAgent\Config\AppConfig'
      $execBridge: '@Ineersa\CodingAgent\Extension\ExtensionExecBridge'
      $commandRegistry: '@Ineersa\Hatfield\ExtensionApi\Command\CommandRegistryInterface'
      $toolContextAccessor: '@Ineersa\AgentCore\Application\Tool\StackToolExecutionContextAccessor'

  # Async extension-agent jobs share agent.execution.bus so BusNameStamp routes
  # re-dispatch to the bus that owns ExtensionAgentJobWorker.
  # transportDsn is fail-closed for sync:// — process controllers override
  # HATFIELD_EXTENSION_AGENT_TRANSPORT_DSN to sqlite-queue:// for real async.
  Ineersa\CodingAgent\Extension\Agent\ExtensionAgentJobDispatcher:
    arguments:
      $bus: '@agent.execution.bus'
      $transportDsn: '%env(HATFIELD_EXTENSION_AGENT_TRANSPORT_DSN)%'

  Ineersa\Hatfield\ExtensionApi\ExtensionApiInterface:
    alias: Ineersa\CodingAgent\Extension\ExtensionToolRegistryBridge

  Ineersa\CodingAgent\Extension\ExtensionToolHookEventSubscriber:
    arguments:
      $cwd: '@=service("Ineersa\\CodingAgent\\Config\\AppConfig").cwd'
      $logger: '@monolog.logger'
      $extensionAllowlistReader: '@Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface'

  Ineersa\CodingAgent\Extension\ExtensionAfterTurnCommitHookSubscriber:
    arguments:
      $extensionAllowlistReader: '@Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface'

  Ineersa\CodingAgent\Runtime\Controller\ExtensionSessionStartHookSubscriber:
    arguments:
      $extensionAllowlistReader: '@Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface'

  Ineersa\CodingAgent\Extension\ExtensionCompactionHookDispatcher:
    arguments:
      $extensionAllowlistReader: '@Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface'

  Ineersa\CodingAgent\Extension\Agent\ExtensionAgentJobWorker:
    arguments:
      $extensionAllowlistReader: '@Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface'

  Ineersa\CodingAgent\Extension\ExtensionManager:
    arguments:
      $extensionApi: '@Ineersa\Hatfield\ExtensionApi\ExtensionApiInterface'

  # LoggingConfig is derived from AppConfig and autowireable.
  Ineersa\CodingAgent\Config\LoggingConfig:
    factory: ['Ineersa\CodingAgent\Config\LoggingConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  Ineersa\CodingAgent\Logging\LogReader:
    arguments:
      $parser: '@Ineersa\CodingAgent\Logging\LogParser'
      $logDir: '@=service("Ineersa\\CodingAgent\\Config\\LoggingConfig").logDir'

  Ineersa\CodingAgent\Agent\Execution\ChildRun\Contract\ChildRunBatchLifecyclePolicyDTO:
    arguments:
      $parentCancelSingleReason: 'Parent run cancelled subagent tool.'
      $singleTimeoutCancelReason: 'Subagent timed out.'
      $launchAbortCancelReason: 'Subagent launch aborted after failure.'

  # Shared project qualification for resource tags and log correlation.
  Ineersa\CodingAgent\Logging\TelemetrySessionKeyProvider:
    arguments:
      $runtimeCwd: '%app.cwd%'

  # Monolog processor — injects RunLogContext fields into every log record.
  Ineersa\CodingAgent\Logging\LogContextProcessor:
    tags:
      - { name: monolog.processor }

  Ineersa\CodingAgent\Logging\FrameworkChannelLevelProcessor:
    tags:
      - { name: monolog.processor }

  # Opt-in once-per-minute session CPU/RSS/process-count sample over DogStatsD.
  # Schedule registration stays on SessionResourceSamplerSchedule so
  # AddScheduleMessengerPass can decorate that provider without replacing the
  # Messenger handler callable on SessionResourceSamplerTask.
  Ineersa\CodingAgent\Logging\SessionResourceSamplerTask:
    arguments:
      $enabled: '%app.session_resource_sampler.enabled%'
      $sessionId: '%env(HATFIELD_SESSION_ID)%'
      $telemetryEnv: '%app.telemetry_env%'
      $dogstatsdHost: '%app.dogstatsd.host%'
      $dogstatsdPort: '%app.dogstatsd.port%'

  Ineersa\CodingAgent\Logging\SessionResourceSamplerSchedule:
    arguments:
      $enabled: '%app.session_resource_sampler.enabled%'
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  # OutputCapConfig is derived from AppConfig and autowireable.
  Ineersa\CodingAgent\Config\OutputCapConfig:
    factory: ['Ineersa\CodingAgent\Config\OutputCapConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # ImageToolConfig is derived from AppConfig and autowireable.
  Ineersa\CodingAgent\Config\ImageToolConfig:
    factory: ['Ineersa\CodingAgent\Config\ImageToolConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # BackgroundProcessConfig is derived from AppConfig and autowireable.
  Ineersa\CodingAgent\Config\BackgroundProcessConfig:
    factory: ['Ineersa\CodingAgent\Config\BackgroundProcessConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'


  # BashToolConfig is derived from AppConfig and autowireable.
  Ineersa\CodingAgent\Config\BashToolConfig:
    factory: ['Ineersa\CodingAgent\Config\BashToolConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # CodeModeConfig is derived from AppConfig and autowireable.
  Ineersa\CodingAgent\Config\CodeModeConfig:
    factory: ['Ineersa\CodingAgent\Config\CodeModeConfig', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # BackgroundProcess store — uses Doctrine ORM EntityManager,
  # no custom normalizer. Schema is managed by Doctrine migrations.
  # ProcessStore and ProcessLifecycle are autowired by Symfony DI.
  Ineersa\CodingAgent\Tool\BackgroundProcessManager:
    arguments:
      $store: '@Ineersa\CodingAgent\Tool\BackgroundProcess\ProcessStore'
      $lifecycle: '@Ineersa\CodingAgent\Tool\BackgroundProcess\ProcessLifecycle'
      $config: '@Ineersa\CodingAgent\Config\BackgroundProcessConfig'
    calls:
      - registerShutdownHandler: []

  Ineersa\CodingAgent\Tool\BackgroundProcessProvisionalCleanupTask:
    arguments:
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  # Startup database migrator — runs known migration classes at startup via DBAL.
  # Uses the app-owned ApplicationMigrationExecutor instead of the Symfony
  # doctrine:migrations:migrate console command to avoid phar:// filesystem
  # scanning issues inside the PHAR. Dev doctrine:migrations commands are
  # still available from the source checkout.
  Ineersa\CodingAgent\Migrations\ApplicationMigrationExecutor:
    arguments:
      $connection: '@doctrine.dbal.default_connection'

  # Explicit outer SQLite transactions reserve the writer slot before reading so
  # busy_timeout can serialize concurrent app-state writers on state.sqlite.
  # autoconfigure: false keeps the default-connection registration explicit.
  Ineersa\CodingAgent\Infrastructure\Doctrine\SqliteImmediateTransactionMiddleware:
    autoconfigure: false
    tags:
      # Priority above DAMA's 100 lets DAMA translate explicit ORM transactions
      # to savepoints without leaving the suite transaction as the outer writer.
      - { name: doctrine.middleware, connection: default, priority: 101 }

  Ineersa\CodingAgent\Migrations\StartupDatabaseMigrator:
    arguments:
      $applicationMigrationExecutor: '@Ineersa\CodingAgent\Migrations\ApplicationMigrationExecutor'
      $sessionCatalogRecovery: '@Ineersa\CodingAgent\Session\SessionCatalogRecoveryService'

  # HatfieldModelCatalog — build from AppConfig.ai so all consumers share the
  # same catalog populated from settings, not an auto-wired empty default.
  # AiCostCalculator, CodingAgentImageCapabilityChecker, and any future
  # catalog consumer must use this definition instead of autowiring.
  Ineersa\CodingAgent\Config\Ai\HatfieldModelCatalog:
    arguments:
      $config: '@=service("Ineersa\\CodingAgent\\Config\\AppConfig").ai'

  # CodingAgentImageCapabilityChecker — wraps HatfieldModelCatalog from AppConfig.
  Ineersa\CodingAgent\Tool\ImageProcessing\CodingAgentImageCapabilityChecker:
    factory: ['Ineersa\CodingAgent\Tool\ImageProcessing\CodingAgentImageCapabilityChecker', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  Ineersa\AgentCore\Contract\Model\ImageCapabilityCheckerInterface:
    alias: Ineersa\CodingAgent\Tool\ImageProcessing\CodingAgentImageCapabilityChecker

  # ── Provider compatibility feature shapers (AgentCore) ──
  # CodingAgent resolves compat features and reasoning options from its catalog
  # and passes them to AgentCore as a simple array. AgentCore's shapers consume
  # that array — no catalog access, no DTOs, no resolver interfaces.

  Ineersa\AgentCore\Infrastructure\SymfonyAi\ReasoningOptionsFeatureShaper:
    tags:
      - { name: 'agent_core.provider_compatibility_feature_shaper' }

  Ineersa\AgentCore\Infrastructure\SymfonyAi\ReasoningContentFeatureShaper:
    tags:
      - { name: 'agent_core.provider_compatibility_feature_shaper' }

  Ineersa\AgentCore\Infrastructure\SymfonyAi\ZaiToolStreamFeatureShaper:
    tags:
      - { name: 'agent_core.provider_compatibility_feature_shaper' }

  Ineersa\AgentCore\Infrastructure\SymfonyAi\ProviderCompatibilityRequestShaper:
    arguments:
      $featureShapers: !tagged_iterator agent_core.provider_compatibility_feature_shaper

  Ineersa\Tui\Application\InteractiveMode:
    arguments:
      $listenerRegistrars: !tagged_iterator { tag: app.tui_listener, default_priority_method: getPriority }
      $catalogRegistrars: !tagged_iterator { tag: app.slash_command_catalog, default_priority_method: getPriority }

  # ─── Per-session TUI composition ───
  # Non-shared projector services: each get() returns a fresh projector
  # with a fresh projection state, so every TuiSessionCompositionFactory::create()
  # call gets independent parent and child projection scopes.
  tui.session.parent_projection_state:
    class: Ineersa\CodingAgent\Runtime\Projection\TranscriptProjectionState
    shared: false

  tui.session.parent_transcript_projector:
    class: Ineersa\CodingAgent\Runtime\ProjectionPipeline\TranscriptProjector
    shared: false
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $state: '@tui.session.parent_projection_state'

  tui.session.child_projection_state:
    class: Ineersa\CodingAgent\Runtime\Projection\TranscriptProjectionState
    shared: false

  tui.session.child_transcript_projector:
    class: Ineersa\CodingAgent\Runtime\ProjectionPipeline\TranscriptProjector
    shared: false
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $state: '@tui.session.child_projection_state'

  Ineersa\Tui\Application\TuiSessionCompositionFactory:
    arguments:
      $projectors: !service_locator
        parent: '@tui.session.parent_transcript_projector'
        child: '@tui.session.child_transcript_projector'

  # ─── Runtime stream wiring ───

  Ineersa\CodingAgent\Runtime\Contract\RuntimeEventSinkInterface:
    alias: Ineersa\CodingAgent\Runtime\InProcess\InMemoryRuntimeEventSink

  # Stream subscribers: autowiring cannot resolve RuntimeEventSinkInterface
  # because there are two implementations (in-process and STDOUT). Explicitly
  # wire the in-process sink as $sink and the STDOUT sink as $stdoutSink.
  Ineersa\CodingAgent\Runtime\Stream\AssistantTextStreamSubscriber:
    arguments:
      $sink: '@Ineersa\CodingAgent\Runtime\InProcess\InMemoryRuntimeEventSink'
      $stdoutSink: '@Ineersa\CodingAgent\Runtime\Stream\StdoutRuntimeEventSink'

  Ineersa\CodingAgent\Runtime\Stream\AssistantThinkingStreamSubscriber:
    arguments:
      $sink: '@Ineersa\CodingAgent\Runtime\InProcess\InMemoryRuntimeEventSink'
      $stdoutSink: '@Ineersa\CodingAgent\Runtime\Stream\StdoutRuntimeEventSink'

  Ineersa\CodingAgent\Runtime\Stream\ToolCallStreamSubscriber:
    arguments:
      $sink: '@Ineersa\CodingAgent\Runtime\InProcess\InMemoryRuntimeEventSink'
      $stdoutSink: '@Ineersa\CodingAgent\Runtime\Stream\StdoutRuntimeEventSink'

  Ineersa\CodingAgent\Agent\Execution\Subagent\ChildRun\Progress\SubagentProgressEventAppender:
    arguments:
      $commandBus: '@agent.command.bus'
      $transientSink: '@Ineersa\CodingAgent\Runtime\Stream\StdoutRuntimeEventSink'
      $streamCommittedEventsToStdout: '%env(bool:HATFIELD_CONSUMER_STDOUT_EVENTS)%'

  # extension_agent permanent failures write transient JSONL via STDOUT from the
  # messenger:consume extension_agent child (same pipe as stream deltas).
  Ineersa\CodingAgent\Extension\Agent\ExtensionAgentJobFailedEventSubscriber:
    arguments:
      $stdoutSink: '@Ineersa\CodingAgent\Runtime\Stream\StdoutRuntimeEventSink'

  # ─── App executable locator chain ───
  # Resolves the agent binary independently of the runtime working directory,
  # so messenger consumers and controller subprocesses always use the correct
  # binary regardless of --cwd or Hatfield project CWD.
  #
  # Ordered fallback:
  #   1. ConfigExecutableLocator — HATFIELD_BINARY_PATH env override
  #   2. PharExecutableLocator — current PHAR self-reference
  #   3. SourceTreeExecutableLocator — source checkout with bin/console
  Ineersa\CodingAgent\Runtime\Process\ConfigExecutableLocator:
    arguments:
      $runtimeCwd: '%app.cwd%'

  Ineersa\CodingAgent\Runtime\Process\SourceTreeExecutableLocator:
    arguments:
      $projectDir: '%kernel.project_dir%'

  Ineersa\CodingAgent\Runtime\Process\ChainExecutableLocator:
    class: Ineersa\CodingAgent\Runtime\Process\ChainExecutableLocator
    arguments:
      - '@Ineersa\CodingAgent\Runtime\Process\ConfigExecutableLocator'
      - '@Ineersa\CodingAgent\Runtime\Process\PharExecutableLocator'
      - '@Ineersa\CodingAgent\Runtime\Process\SourceTreeExecutableLocator'

  Ineersa\CodingAgent\Runtime\Process\AppExecutableLocator:
    alias: Ineersa\CodingAgent\Runtime\Process\ChainExecutableLocator

  # Centralized runtime process context for subprocess spawning.
  # Injected into JsonlProcessAgentSessionClient and ConsumerSupervisor.
  Ineersa\CodingAgent\Runtime\Process\RuntimeProcessConfig:
    arguments:
      $executableLocator: '@Ineersa\CodingAgent\Runtime\Process\AppExecutableLocator'
      $runtimeCwd: '%app.cwd%'

  Ineersa\CodingAgent\Runtime\Messenger\SessionSqliteQueueConnectorFactory:
    arguments:
      $runtimeConfig: '@Ineersa\CodingAgent\Runtime\Process\RuntimeProcessConfig'

  Ineersa\CodingAgent\Runtime\Messenger\SerializedBrokerSendersLocator:
    decorates: messenger.senders_locator
    arguments:
      $inner: '@Ineersa\CodingAgent\Runtime\Messenger\SerializedBrokerSendersLocator.inner'

  # Same-process llm Fiber consumer. Uses the sqlite-queue consume locator so
  # native WAIT stays intact; stock messenger:consume --concurrency remains
  # child-process ParallelExecutionStrategy and is not used for llm.
  Ineersa\CodingAgent\Runtime\Messenger\LlmFiberConsumeReceiverLocator:
    class: Ineersa\SqliteQueue\Messenger\ConsumeReceiverLocator
    arguments:
      - '@messenger.receiver_locator'
      - '@Ineersa\SqliteQueue\Messenger\NativeConsumeWaitSubscriber'

  Ineersa\CodingAgent\Runtime\Messenger\LlmFiberConsumeCommand:
    arguments:
      $routableBus: '@messenger.routable_message_bus'
      $receiverLocator: '@Ineersa\CodingAgent\Runtime\Messenger\LlmFiberConsumeReceiverLocator'
      $eventDispatcher: '@event_dispatcher'
      $appConfig: '@Ineersa\CodingAgent\Config\AppConfig'
      $logger: '@logger'

  Ineersa\CodingAgent\Runtime\Messenger\LlmFiberConsumeWaitSubscriber:
    arguments:
      $receiverLocator: '@messenger.receiver_locator'
    tags:
      - { name: kernel.event_subscriber }

  # ─── Controller event loop ───

  # Command handlers (ControllerCommandEvent listeners) receive the
  # in-process client so they can dispatch commands to the run_control,
  # llm, and tool transports without spawning subprocesses.
  #
  # Controller command handlers type-hint against the AgentSessionClient
  # interface so they remain testable with test spies (InProcessAgentSessionClient
  # is final and cannot be mocked). The concrete implementation calls
  # agent-core services directly in-process.
  Ineersa\CodingAgent\Runtime\Contract\AgentSessionClient:
    alias: 'Ineersa\CodingAgent\Runtime\InProcess\InProcessAgentSessionClient'

  # ShellCommandHandler validates the JSONL shell_command protocol and dispatches
  # ApplyShellCommand on the command bus. ApplyShellCommandHandler (under the run
  # lock) owns turn allocation and later dispatches ExecuteShellToolCall on the
  # execution bus so bash still runs in the tool consumer (issue #183).
  Ineersa\CodingAgent\Runtime\Controller\CommandHandler\ShellCommandHandler:
    arguments:
      $commandBus: '@agent.command.bus'

  # Explicit wiring overrides Ineersa\CodingAgent\ resource autowire (bool $streamCommittedEventsToStdout).
  Ineersa\CodingAgent\Runtime\Stream\StreamingCommittedRuntimeEventStore:
    arguments:
      $inner: '@Ineersa\CodingAgent\Agent\Artifact\ChildAwareEventStore'
      $stdoutSink: '@Ineersa\CodingAgent\Runtime\Stream\CommittedRuntimeEventStdoutSink'
      $streamCommittedEventsToStdout: '%env(bool:HATFIELD_CONSUMER_STDOUT_EVENTS)%'

  # Managed FlockStore directories for controller single-owner locks. Default FrameworkBundle
  # flock is partitioned by kernel.project_dir and would diverge across installs.
  hatfield.controller.session_owner.lock_store:
    class: Ineersa\CodingAgent\Runtime\Controller\ControllerSessionOwnerLockStore
    arguments:
      - '%hatfield.controller.session_owner_lock_dir%'

  Ineersa\CodingAgent\Runtime\Controller\ControllerSessionOwnerLockStore: '@hatfield.controller.session_owner.lock_store'

  hatfield.controller.session_owner.lock_factory:
    class: Symfony\Component\Lock\LockFactory
    arguments:
      - '@hatfield.controller.session_owner.lock_store'

  Ineersa\CodingAgent\Runtime\Controller\HeadlessController:
    arguments:
      $dispatcher: '@event_dispatcher'
      # Canonical project CWD for single-owner session lock key (not process getcwd()).
      $runtimeCwd: '%app.cwd%'
      # Project-scoped factory only — not the global default LockFactory.
      $sessionOwnerLockFactory: '@hatfield.controller.session_owner.lock_factory'

  # YAML max_payload is authoritative. Live max_connections is sized per session
  # by HeadlessController from the resolved LLM/tool topology.
  Ineersa\CodingAgent\Runtime\Messenger\SessionSqliteQueueBrokerSupervisor:
    arguments:
      $maxPayload: '%hatfield.sqlite_queue.max_payload%'

  Ineersa\CodingAgent\Runtime\Controller\BackgroundProcessCompletionPoller:
    arguments:
      # Parent controller session from HATFIELD_SESSION_ID; poll loop scopes refresh
      # and notifications to that session plus child agent run IDs from the artifact registry.
      $sessionId: '%env(HATFIELD_SESSION_ID)%'

  # Stream observer delegates to Symfony EventDispatcher with per-delta subscribers.
  Ineersa\CodingAgent\Runtime\Stream\LlmStreamDispatchObserver:
    arguments:
      $dispatcher: '@event_dispatcher'

  Ineersa\AgentCore\Contract\Hook\LlmStreamObserverInterface:
    alias: Ineersa\CodingAgent\Runtime\Stream\LlmStreamDispatchObserver

  Ineersa\CodingAgent\Runtime\Stream\LlmRequestRetryDispatchObserver:
    arguments:
      $sink: '@Ineersa\CodingAgent\Runtime\InProcess\InMemoryRuntimeEventSink'
      $stdoutSink: '@Ineersa\CodingAgent\Runtime\Stream\StdoutRuntimeEventSink'

  Ineersa\AgentCore\Contract\Hook\LlmRequestRetryObserverInterface:
    alias: Ineersa\CodingAgent\Runtime\Stream\LlmRequestRetryDispatchObserver

  Ineersa\AgentCore\Infrastructure\SymfonyAi\Retry\LlmRequestRetryPolicy:
    factory: ['Ineersa\CodingAgent\Infrastructure\SymfonyAi\Retry\LlmRequestRetryPolicyFactory', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  # RuntimeEventMapper uses RuntimeEventTranslator with an explicit dispatch table.
  # EventDispatcher is still passed for extension subscribers that observe the
  # mapping flow (agent_command_applied and HITL routing).
  Ineersa\CodingAgent\Runtime\Protocol\RuntimeEventTranslator:
    arguments:
      $eventDispatcher: '@event_dispatcher'

  Ineersa\CodingAgent\Runtime\Contract\TranscriptProjectorInterface:
    alias: Ineersa\CodingAgent\Runtime\ProjectionPipeline\TranscriptProjector

  Ineersa\CodingAgent\Runtime\Contract\HistoryProviderInterface:
    alias: Ineersa\CodingAgent\Session\SessionHistoryProvider

  Ineersa\CodingAgent\Runtime\Contract\SessionTranscriptProviderInterface:
    alias: Ineersa\CodingAgent\Session\SessionTranscriptProvider

  child_run.transcript.projection_state:
    class: Ineersa\CodingAgent\Runtime\Projection\TranscriptProjectionState

  child_run.transcript.transcript_projector:
    class: Ineersa\CodingAgent\Runtime\ProjectionPipeline\TranscriptProjector
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $state: '@child_run.transcript.projection_state'

  Ineersa\CodingAgent\Runtime\ChildRunTranscriptSnapshotProvider:
    arguments:
      $transcriptProjector: '@child_run.transcript.transcript_projector'

  Ineersa\CodingAgent\Runtime\Contract\ChildRunTranscriptSnapshotProviderInterface:
    alias: Ineersa\CodingAgent\Runtime\ChildRunTranscriptSnapshotProvider

  Ineersa\CodingAgent\Runtime\Contract\ChildAgentEventsPathResolverInterface:
    alias: Ineersa\CodingAgent\Session\ChildAgentEventsPathResolver

  Ineersa\Tui\Export\SessionEventsExportService: ~


  Ineersa\AgentCore\Contract\Replay\RunStateRebuilderInterface:
    alias: Ineersa\CodingAgent\Session\Replay\SessionRunStateReplayService

  owner.replay.projection_state:
    class: Ineersa\CodingAgent\Runtime\Projection\TranscriptProjectionState

  owner.replay.transcript_projector:
    class: Ineersa\CodingAgent\Runtime\ProjectionPipeline\TranscriptProjector
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $state: '@owner.replay.projection_state'

  Ineersa\CodingAgent\Session\Replay\SessionReplayCoordinator:
    arguments:
      $projector: '@owner.replay.transcript_projector'

  Ineersa\CodingAgent\Session\Contract\RunHistorySourceProviderInterface:
    alias: Ineersa\CodingAgent\Agent\Artifact\ChildAwareEventStore

  Ineersa\AgentCore\Contract\ActiveRunContextInterface:
    alias: Ineersa\CodingAgent\Agent\Artifact\ActiveRunContext


  Ineersa\AgentCore\Contract\History\HistorySelectionServiceInterface:
    alias: Ineersa\CodingAgent\Session\History\HistorySelectionService

  Ineersa\AgentCore\Contract\History\HistoryTailDiscardInterface:
    alias: Ineersa\CodingAgent\Session\History\HistoryTailDiscardService

  # ─── Symfony AI Platform wiring ───
  # PlatformInterface reads Hatfield config from autowired AppConfig,
  # so no explicit arguments are needed here.

  # Explicit service definition for the platform factory so the DI container
  # can resolve the service ID during compilation. The class is also
  # auto-registered by the resource import, but the explicit definition
  # guarantees it survives when the PHAR resource path uses wildcard
  # patterns (phar:// paths require **/*.php globs for reliable Symfony DI
  # service discovery — bare directory paths register 0 services).
  Ineersa\CodingAgent\Infrastructure\SymfonyAi\ConfiguredSymfonyAiPlatformFactory: ~

  # Lazy so console/migration/extension boot does not construct OAuth providers.
  Symfony\AI\Platform\PlatformInterface:
    lazy: true
    factory: ['@Ineersa\CodingAgent\Infrastructure\SymfonyAi\ConfiguredSymfonyAiPlatformFactory', 'createPlatform']

  # Extension API agent/event capabilities.
  # Wire modelCatalog from AppConfig.catalog (nullable) — not the standalone
  # HatfieldModelCatalog service, whose constructor requires non-null AiConfig.
  # Without AI settings (e.g. isolated PHAR list), catalog is null and
  # contextWindow() returns null instead of TypeError during service construction.
  # Lazy: only needed when an extension calls $api->agent(). Keeps child-launch
  # selection paths off the PlatformInterface proxy graph.
  Ineersa\CodingAgent\Extension\Agent\ConfiguredModelAgentRunner:
    lazy: true
    arguments:
      $modelCatalog: '@=service("Ineersa\\CodingAgent\\Config\\AppConfig").catalog'

  Ineersa\Hatfield\ExtensionApi\Agent\AgentRunnerInterface:
    alias: Ineersa\CodingAgent\Extension\Agent\ConfiguredModelAgentRunner

  Ineersa\Hatfield\ExtensionApi\Session\SessionEventReaderInterface:
    alias: Ineersa\CodingAgent\Extension\Session\ExtensionSessionEventReader

  Ineersa\AgentCore\Contract\Model\RunModelResolverInterface:
    alias: Ineersa\CodingAgent\Compaction\ModelSelectionActiveModelResolver


  Ineersa\AgentCore\Application\Pipeline\ApplyCommandHandler:
    arguments:
      $serializer: '@serializer'

  Ineersa\AgentCore\Application\Pipeline\LlmStepResultHandler:
    arguments:
      $toolExecutionSettings: '@Ineersa\AgentCore\Contract\Tool\ToolExecutionSettingsInterface'
      $maxParallelism: '@=max(1, service("Ineersa\\CodingAgent\\Config\\AppConfig").tools.execution.maxParallelism)'

  # ─── System prompt builder ───
  Symfony\AI\Platform\Message\TemplateRenderer\StringTemplateRenderer: ~

  Ineersa\CodingAgent\SystemPrompt\SystemPromptBuilder:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $promptContributorProvider: '@Ineersa\CodingAgent\Extension\ExtensionHookRegistry'

  # ─── Compaction prompt builder ───
  Ineersa\CodingAgent\Compaction\CompactionPromptBuilder:
    arguments:
      $projectDir: '%kernel.project_dir%'

  # ─── Compaction pipeline (COMP-02) ───

  # Compaction service: CodingAgent adapter implementing the AgentCore contract.
  # Autowiring resolves SessionCompactor, hooks, model selection, and PlatformInterface
  # for synchronous compactMessages; the interface alias lets AgentCore pipeline
  # code depend on the contract.
  Ineersa\AgentCore\Contract\Compaction\CompactionServiceInterface:
    alias: Ineersa\CodingAgent\Compaction\CompactionService

  # Compaction worker: async model invocation for summarization.
  # Returns CompactionStepResult for ledger notification.
  # @see ExecuteLlmStepWorker for the parallel LLM-step pattern.

  # ─── Compaction auto-trigger (COMP-06) ───

  # Pre-LLM guard: CodingAgent implementation of the AgentCore contract.
  # Injected into AdvanceRunHandler (AgentCore) so AgentCore can check
  # auto-compaction policy without depending on CodingAgent internals.
  Ineersa\AgentCore\Contract\Compaction\PreLlmCompactionGuardInterface:
    alias: Ineersa\CodingAgent\Compaction\CodingAgentPreLlmCompactionGuard

  # Context-budget wrap-up reminder thresholds (CodingAgent after-turn hook).
  Ineersa\CodingAgent\Config\ContextBudgetReminderConfig:
    factory: ['Ineersa\CodingAgent\Config\ContextBudgetReminderConfig', 'fromAppConfig']

  # Reminder and auto-compaction preparation are auto-tagged through
  # EssentialAfterTurnHookInterface. Their captured actions use the command bus.

  # ToolRegistry — concrete CodingAgent registry for permanent/dynamic tools.
  # Tagged built-in providers are seeded during registry construction.
  Ineersa\CodingAgent\Tool\ToolRegistry:
    arguments:
      $providers: !tagged_iterator hatfield.tool_provider

  Ineersa\CodingAgent\Tool\ToolRegistryInterface:
    alias: Ineersa\CodingAgent\Tool\ToolRegistry

  # Subagent tool: definition provider is tagged; handler resolves execution at invoke time only.
  Ineersa\CodingAgent\Agent\Tool\SubagentToolHandler:
    arguments:
      $executionServiceLocator: !service_locator
        execution: '@Ineersa\CodingAgent\Agent\Execution\SubagentExecutionService'

  Ineersa\CodingAgent\Agent\Tool\AgentResumeToolHandler:
    arguments:
      $executionServiceLocator: !service_locator
        execution: '@Ineersa\CodingAgent\Agent\Execution\AgentResumeExecutionService'

  Ineersa\CodingAgent\Agent\Tool\ForkToolHandler:
    arguments:
      $executionServiceLocator: !service_locator
        execution: '@Ineersa\CodingAgent\Agent\Fork\ForkExecutionService'

  # code_mode: definition provider is tagged; toolbox resolves only at nested invoke time.
  Ineersa\CodingAgent\Tool\CodeMode\CodeModeHostBridge:
    arguments:
      $commandBus: '@agent.command.bus'
      $toolboxLocator: !service_locator
        toolbox: '@Ineersa\CodingAgent\Tool\RegistryBackedToolbox'

  # CodingAgent ToolSetResolver — bridges ToolRegistry to AgentCore resolver seam.
  # The inner resolver (CodingAgentToolSetResolver) is wrapped by
  # McpCatalogRegisteringToolSetResolver so MCP dynamic tools from the
  # session catalog are registered before the active tool snapshot is built.
  Ineersa\CodingAgent\Tool\CodingAgentToolSetResolver:
    arguments:
      $toolRegistry: '@Ineersa\CodingAgent\Tool\ToolRegistryInterface'

  # Parent/main runs hide MCP tools from availability=specific servers.
  Ineersa\CodingAgent\Mcp\Tool\McpParentAvailabilityToolSetResolver:
    arguments:
      $inner: '@Ineersa\CodingAgent\Tool\CodingAgentToolSetResolver'
      $relationshipReader: '@Ineersa\CodingAgent\Repository\RunRelationshipReader'
      $catalogStore: '@Ineersa\CodingAgent\Mcp\Catalog\McpToolCatalogStoreInterface'
      $configLoader: '@Ineersa\CodingAgent\Mcp\Config\McpConfigLoader'
      $availability: '@Ineersa\CodingAgent\Mcp\Tool\McpServerToolAvailability'

  # MCP-aware wrapper: calls registrar before delegate so LLM-visible
  # tool schemas and execution allowlists include catalog-backed MCP tools.
  Ineersa\CodingAgent\Mcp\Tool\McpCatalogRegisteringToolSetResolver:
    arguments:
      $inner: '@Ineersa\CodingAgent\Mcp\Tool\McpParentAvailabilityToolSetResolver'
      $mcpToolRegistrar: '@Ineersa\CodingAgent\Mcp\Tool\McpToolRegistrar'
      $relationshipReader: '@Ineersa\CodingAgent\Repository\RunRelationshipReader'
      $catalogStore: '@Ineersa\CodingAgent\Mcp\Catalog\McpToolCatalogStoreInterface'
      $logger: '@logger'

  # Subagent tool-set decorator: wraps the MCP-registering resolver and
  # intersects the active toolset with per-run child agent policy read
  # from RunStarted metadata.  Non-child runs pass through unchanged.
  Ineersa\CodingAgent\Agent\Execution\SubagentToolSetResolver:
    arguments:
      $inner: '@Ineersa\CodingAgent\Mcp\Tool\McpCatalogRegisteringToolSetResolver'
      $metadataReader: '@Ineersa\CodingAgent\Agent\Execution\RunStartedMetadataReader'
      $toolRegistry: '@Ineersa\CodingAgent\Tool\ToolRegistryInterface'

  # Immutable RunStarted launch metadata (tools/extensions/model/reasoning).
  Ineersa\CodingAgent\Agent\Execution\RunStartedMetadataReader:
    arguments:
      $eventStore: '@Ineersa\AgentCore\Contract\EventStoreInterface'

  Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface:
    alias: Ineersa\CodingAgent\Agent\Execution\RunStartedMetadataReader

  Ineersa\CodingAgent\Repository\RunRelationshipReaderInterface:
    alias: Ineersa\CodingAgent\Repository\RunRelationshipReader

  Ineersa\AgentCore\Contract\Tool\ToolSetResolverInterface:
    alias: Ineersa\CodingAgent\Agent\Execution\SubagentToolSetResolver

  # RegistryBackedToolbox — reads ToolRegistry definitions and exposes them through
  # the Symfony AI ToolboxInterface so the existing Execution pipeline can invoke
  # registered handlers (permanent, dynamic, and extension-registered tools).
  # Execution itself is delegated to the native Symfony AI Toolbox.
  #
  # The concrete resolver gets the app serializer (camel_case_to_snake_case)
  # so provider keys like artifact_id denormalize onto DTO properties like
  # artifactId. The interface alias points to the raw-array-aware decorator.
  Symfony\AI\Agent\Toolbox\ToolCallArgumentResolver:
    arguments:
      $denormalizer: '@serializer'

  Symfony\AI\Agent\Toolbox\ToolCallArgumentResolverInterface:
    alias: Ineersa\CodingAgent\Tool\RawAwareToolCallArgumentResolver

  Ineersa\CodingAgent\Tool\RawAwareToolCallArgumentResolver:
    arguments:
      $inner: '@Symfony\AI\Agent\Toolbox\ToolCallArgumentResolver'

  # Native Symfony AI object validation for resolved DTO tool arguments.
  Symfony\AI\Agent\Toolbox\EventListener\ValidateToolCallArgumentsListener:
    arguments:
      $validator: '@validator'
    tags:
      - { name: kernel.event_listener, event: Symfony\AI\Agent\Toolbox\Event\ToolCallArgumentsResolved }

  # ─── Tool schema providers & native JsonSchema chain ───
  #
  # DTO properties whose provider-visible schema depends on runtime settings
  # (Bash timeout max) contribute a fragment through
  # Symfony AI SchemaProviderInterface (#[Schema(provider: ...)]). The native
  # Describer default chain would instantiate SchemaAttributeDescriber without
  # providers, so the chain is rebuilt explicitly with the provider-aware
  # describer and fed into the JsonSchema Factory used by
  # RegistryBackedToolbox. Providers are autowired with the same config
  # instances their matching runtime constraints consume, so the schema bounds
  # and validation limits cannot drift.
  Symfony\AI\Platform\Contract\JsonSchema\Describer\SchemaAttributeDescriber:
    arguments:
      $providers:
        Ineersa\CodingAgent\Tool\Schema\BashTimeoutSchemaProvider: '@Ineersa\CodingAgent\Tool\Schema\BashTimeoutSchemaProvider'

  # Same default chain as Describer(null) plus the provider-aware describer.
  # The chain members are vendor classes outside the autowire resource, so
  # they get explicit no-arg services (identical to their PHP defaults).
  Symfony\AI\Platform\Contract\JsonSchema\Describer\SerializerDescriber:
    autowire: false

  Symfony\AI\Platform\Contract\JsonSchema\Describer\TypeInfoDescriber:
    autowire: false

  Symfony\AI\Platform\Contract\JsonSchema\Describer\MethodDescriber:
    autowire: false

  Symfony\AI\Platform\Contract\JsonSchema\Describer\PropertyInfoDescriber:
    autowire: false

  Symfony\AI\Platform\Contract\JsonSchema\Describer\ValidatorConstraintsDescriber:
    autowire: false

  Symfony\AI\Platform\Contract\JsonSchema\Describer\Describer:
    arguments:
      $describers:
        - '@Symfony\AI\Platform\Contract\JsonSchema\Describer\SerializerDescriber'
        - '@Symfony\AI\Platform\Contract\JsonSchema\Describer\TypeInfoDescriber'
        - '@Symfony\AI\Platform\Contract\JsonSchema\Describer\MethodDescriber'
        - '@Symfony\AI\Platform\Contract\JsonSchema\Describer\PropertyInfoDescriber'
        - '@Symfony\AI\Platform\Contract\JsonSchema\Describer\ValidatorConstraintsDescriber'
        - '@Symfony\AI\Platform\Contract\JsonSchema\Describer\SchemaAttributeDescriber'

  Symfony\AI\Agent\Toolbox\MapToolArgumentsDescriber:
    arguments:
      $inner: '@Symfony\AI\Platform\Contract\JsonSchema\Describer\Describer'

  Symfony\AI\Platform\Contract\JsonSchema\Factory:
    arguments:
      $objectDescriber: '@Symfony\AI\Agent\Toolbox\MapToolArgumentsDescriber'

  Ineersa\CodingAgent\Tool\RegistryBackedToolbox:
    arguments:
      $registry: '@Ineersa\CodingAgent\Tool\ToolRegistryInterface'
      $argumentResolver: '@Symfony\AI\Agent\Toolbox\ToolCallArgumentResolverInterface'
      $schemaFactory: '@Symfony\AI\Platform\Contract\JsonSchema\Factory'
      $eventDispatcher: '@event_dispatcher'
      $rewriteHookProvider: '@Ineersa\CodingAgent\Extension\ExtensionHookRegistry'
      $contextAccessor: '@Ineersa\AgentCore\Application\Tool\StackToolExecutionContextAccessor'
      $extensionAllowlistReader: '@Ineersa\CodingAgent\Extension\ChildRunExtensionAllowlistReaderInterface'

  Symfony\AI\Agent\Toolbox\ToolboxInterface:
    alias: Ineersa\CodingAgent\Tool\RegistryBackedToolbox

  # ─── TOOLS-00 Tool cancellation context bridge ───

  # ToolSettings resolves tools.execution defaults from typed AppConfig DTOs.
  Ineersa\CodingAgent\Config\ToolSettings:
    factory: ['Ineersa\CodingAgent\Config\ToolSettings', 'fromAppConfig']
    arguments:
      - '@Ineersa\CodingAgent\Config\AppConfig'

  Ineersa\AgentCore\Contract\Tool\ToolExecutionSettingsInterface:
    alias: Ineersa\CodingAgent\Config\ToolSettings

  # Tool executor wiring: read execution defaults from merged Hatfield settings.
  # The toolbox wires to RegistryBackedToolbox; toolSetResolver to CodingAgentToolSetResolver.
  # Execution mode per tool is set at registration time by the tool author/provider
  # in ToolDefinitionDTO, not from settings overrides.
  Ineersa\CodingAgent\Tool\CodeMode\CodeModeDiagnosticsToolResultProcessor:
    tags:
      - { name: agent_core.tool_result_processor, priority: 100 }

  Ineersa\CodingAgent\Tool\OutputCapToolResultProcessor:
    tags:
      - { name: agent_core.tool_result_processor, priority: 0 }

  Ineersa\CodingAgent\Tool\OutputCapLlmTransformHook:
    autoconfigure: false
    tags:
      - { name: agent_core.transform_context_hook, priority: 0 }

  Ineersa\AgentCore\Application\Handler\ToolExecutor:
    factory: ['Ineersa\AgentCore\Application\Handler\ToolExecutor', 'fromSettings']
    arguments:
      $settings: '@Ineersa\AgentCore\Contract\Tool\ToolExecutionSettingsInterface'
      $toolbox: '@Symfony\AI\Agent\Toolbox\ToolboxInterface'
      $contextAccessor: '@Ineersa\AgentCore\Application\Tool\StackToolExecutionContextAccessor'
      $toolSetResolver: '@Ineersa\AgentCore\Contract\Tool\ToolSetResolverInterface'
      $toolResultProcessors: !tagged_iterator agent_core.tool_result_processor
  Ineersa\AgentCore\Contract\Tool\ToolLaunchInputStoreInterface:
    alias: Ineersa\CodingAgent\Session\SessionToolLaunchInputStore

  Ineersa\AgentCore\Contract\Tool\ToolPayloadStoreInterface:
    alias: Ineersa\CodingAgent\Session\SessionToolPayloadStore

  # Durable tool-batch scheduling lives in application SQLite; payload paths remain for launch/execution files.
  Ineersa\CodingAgent\Session\ToolBatchRunStoragePathsInterface:
    alias: Ineersa\CodingAgent\Agent\Artifact\ChildAwareToolBatchRunStoragePaths

  Ineersa\AgentCore\Contract\Tool\ToolBatchStoreInterface:
    alias: Ineersa\CodingAgent\Session\DoctrineToolBatchStore

  Ineersa\AgentCore\Contract\ApplicationDbTransactionInterface:
    alias: Ineersa\CodingAgent\Session\DoctrineApplicationDbTransaction

  # ─── AI-10 Per-turn model/reasoning routing ───

  Ineersa\AgentCore\Contract\Model\ModelResolverInterface:
    alias: Ineersa\CodingAgent\Agent\Execution\SessionAwareModelResolver

  # ─── AgentCore pipeline wiring (services that need tagged iterators or scalar binding) ───

  Ineersa\AgentCore\Application\Pipeline\RunMessageProcessor:
    arguments:
      $handlers: !tagged_iterator agent_core.run_message_handler
      $historyTailDiscard: '@Ineersa\AgentCore\Contract\History\HistoryTailDiscardInterface'

  Ineersa\AgentCore\Application\Handler\StepDispatcher:
    arguments:
      $commandBus: '@agent.command.bus'
      $executionBus: '@agent.execution.bus'

  Ineersa\AgentCore\Application\Handler\ExecuteLlmStepWorker:
    arguments:
      $commandBus: '@agent.command.bus'

  Ineersa\AgentCore\Application\Handler\ExecuteCompactionStepWorker:
    arguments:
      $commandBus: '@agent.command.bus'

  Ineersa\AgentCore\Application\Handler\ExecuteToolCallWorker:
    arguments:
      $commandBus: '@agent.command.bus'

  Ineersa\CodingAgent\Runtime\Controller\CommandHandler\ExecuteShellToolCallWorker:
    arguments:
      $commandBus: '@agent.command.bus'

  Ineersa\AgentCore\Application\Pipeline\TransitionFinalizer:
    arguments:
      $store: '@Ineersa\AgentCore\Contract\PreparedTransitionEventStoreInterface'
      $dispatcher: '@Ineersa\AgentCore\Application\Handler\StepDispatcher'
      $localMetadata: '@Ineersa\AgentCore\Application\Pipeline\LocalMetadataCoordinator'
      $plans: '@Ineersa\AgentCore\Application\Pipeline\TransitionPlanFactory'

  Ineersa\AgentCore\Application\Handler\CommandRouter:
    arguments:
      $handlers: !tagged_iterator agent_core.command_handler

  Ineersa\AgentCore\Application\Handler\HookDispatcher:
    arguments:
      $subscribers: !tagged_iterator agent_core.hook_subscriber

  Ineersa\CodingAgent\Compaction\CompactionHookDispatcher:
    arguments:
      $hooks: !tagged_iterator coding_agent.before_compaction_hook

  Ineersa\AgentCore\Infrastructure\SymfonyAi\ProviderRequestPreparer:
    arguments:
      $hooks: !tagged_iterator agent_core.before_provider_request_hook

  # LlmPlatformAdapter hooks — ImageGatingConvertHook registers as a convert_to_llm hook.
  # Only LLM retry backoff uses cooperative sleep; OAuth and other clock users
  # keep their existing framework clock binding.
  Ineersa\AgentCore\Infrastructure\SymfonyAi\Retry\AmpRetryClock:
    arguments:
      $clock: '@Symfony\Component\Clock\NativeClock'

  Ineersa\AgentCore\Infrastructure\SymfonyAi\LlmPlatformAdapter:
    arguments:
      $transformContextHooks: !tagged_iterator agent_core.transform_context_hook
      $convertToLlmHooks: !tagged_iterator agent_core.convert_to_llm_hook
      $costCalculator: '@Ineersa\CodingAgent\Config\Ai\AiCostCalculator'
      $modelResolver: '@Ineersa\AgentCore\Contract\Model\ModelResolverInterface'
      $retryObserver: '@Ineersa\AgentCore\Contract\Hook\LlmRequestRetryObserverInterface'
      $requestRetryPolicy: '@Ineersa\AgentCore\Infrastructure\SymfonyAi\Retry\LlmRequestRetryPolicy'
      $clock: '@Ineersa\AgentCore\Infrastructure\SymfonyAi\Retry\AmpRetryClock'

  Ineersa\AgentCore\Contract\Model\PlatformInterface:
    alias: Ineersa\AgentCore\Infrastructure\SymfonyAi\LlmPlatformAdapter

  Ineersa\AgentCore\Domain\Model\CostCalculatorInterface:
    alias: Ineersa\CodingAgent\Config\Ai\AiCostCalculator

  # ─── Completion providers ────────────────────────────────────
  # CompletionProvider implementations are auto-tagged for the
  # composite registry.  Priority order: slash commands before
  # file mentions so leading "/" doesn't trigger both providers.

  Ineersa\Tui\Completion\SlashCommandCompletionProvider:
    tags:
      - { name: 'app.completion_provider', priority: 100 }

  Ineersa\Tui\Completion\SessionIdCompletionProvider:
    tags:
      - { name: 'app.completion_provider', priority: 95 }

  Ineersa\Tui\Completion\SettingsPathCompletionProvider:
    tags:
      - { name: 'app.completion_provider', priority: 93 }

  Ineersa\Tui\Completion\FileMentionCompletionProvider:
    tags:
      - { name: 'app.completion_provider', priority: 90 }

  Ineersa\Tui\Completion\FileMentionIndexReader:
    arguments:
      $indexPath: '%app.file_mention_index_path%'

  # Composite provider aggregates all tagged CompletionProvider
  # implementations.  CompletionListener depends on CompletionProvider
  # (not a concrete type), so DI resolves this composite.
  Ineersa\Tui\Completion\CompletionProviderRegistry:
    arguments:
      $providers: !tagged_iterator app.completion_provider

  Ineersa\Tui\Completion\CompletionProvider:
    alias: Ineersa\Tui\Completion\CompletionProviderRegistry

  # File mention index builder — used by CompletionFileIndexRefreshCommand
  # (scheduler-only refresh owner). Not autowireable (string constructor
  # args for cwd and index path).
  Ineersa\CodingAgent\CLI\FileMentionIndexBuilder:
    arguments:
      $cwd: '%app.cwd%'
      $indexPath: '%app.file_mention_index_path%'

  # ─── MCP Client (Phases 0-3) ───────────────────────────────────

  # Config loader — needs explicit scalar $projectCwd binding
  # because Symfony DI cannot autowire plain strings.
  Ineersa\CodingAgent\Mcp\Config\McpConfigLoader:
    arguments:
      $projectCwd: '%app.cwd%'

  # MCP session lifecycle dispatcher — injects the command bus
  # explicitly (not autowired to agent.execution.bus).
  Ineersa\CodingAgent\Mcp\McpSessionLifecycleDispatcher:
    arguments:
      $commandBus: '@agent.command.bus'

  # MCP lifecycle message handler is auto-discovered via #[AsMessageHandler]
  # and autowired.  McpConnectionManagerInterface is resolved via the
  # alias above; only McpToolCatalogStoreInterface needs explicit wiring
  # (SessionFileMcpToolCatalogStore with projectCwd).
  Ineersa\CodingAgent\Mcp\Handler\McpInitializeSessionHandler:
    arguments:
      $catalogStore: '@Ineersa\CodingAgent\Mcp\Catalog\SessionFileMcpToolCatalogStore'

  # Alias the interface so handlers depend on the abstraction.
  Ineersa\CodingAgent\Mcp\Client\McpConnectionManagerInterface:
    alias: Ineersa\CodingAgent\Mcp\Client\McpConnectionManager

  ## MCP session-file catalog store — needs explicit $projectCwd
  Ineersa\CodingAgent\Mcp\Catalog\SessionFileMcpToolCatalogStore:
    arguments:
      $projectCwd: '%app.cwd%'

  # Defer only these consumers' optional graphs, retaining the shared services.
  # Lazy current([service]) factories resolve the original instance on first use.
  Ineersa\CodingAgent\CLI\AgentCommand:
    arguments:
      $inProcessClient: !service { class: Ineersa\CodingAgent\Runtime\InProcess\InProcessAgentSessionClient, factory: current, arguments: [['@Ineersa\CodingAgent\Runtime\InProcess\InProcessAgentSessionClient']], lazy: true }
      $processClient: !service { class: Ineersa\CodingAgent\Runtime\Process\JsonlProcessAgentSessionClient, factory: current, arguments: [['@Ineersa\CodingAgent\Runtime\Process\JsonlProcessAgentSessionClient']], lazy: true }
      $interactiveMode: !service { class: Ineersa\Tui\Application\InteractiveMode, factory: current, arguments: [['@Ineersa\Tui\Application\InteractiveMode']], lazy: true }
      $controller: !service { class: Ineersa\CodingAgent\Runtime\Controller\HeadlessController, factory: current, arguments: [['@Ineersa\CodingAgent\Runtime\Controller\HeadlessController']], lazy: true }

  Ineersa\CodingAgent\Runtime\Messenger\PendingTransitionRecoverySubscriber:
    arguments:
      $transitions: !service { class: Ineersa\CodingAgent\Runtime\Stream\StreamingCommittedRuntimeEventStore, factory: current, arguments: [['@Ineersa\AgentCore\Contract\PreparedTransitionEventStoreInterface']], lazy: true }
      $recovery: !service { class: Ineersa\AgentCore\Application\Pipeline\PendingTransitionRecovery, factory: current, arguments: [['@Ineersa\AgentCore\Application\Pipeline\PendingTransitionRecovery']], lazy: true }
      $locks: !service { class: Ineersa\AgentCore\Application\Handler\RunLockManager, factory: current, arguments: [['@Ineersa\AgentCore\Application\Handler\RunLockManager']], lazy: true }
      $ownership: !service { class: Ineersa\CodingAgent\Agent\Artifact\OwnedRunIdsProvider, factory: current, arguments: [['@Ineersa\CodingAgent\Agent\Artifact\OwnedRunIdsProvider']], lazy: true }

  # Inject MCP lifecycle dispatcher so start/resume both trigger MCP initialize.
  Ineersa\CodingAgent\Runtime\InProcess\InProcessAgentSessionClient:
    arguments:
      $commandBus: '@agent.command.bus'
      $mcpDispatcher: '@Ineersa\CodingAgent\Mcp\McpSessionLifecycleDispatcher'

  # ─── MCP-04 / MCP-05 Dynamic MCP tool registration + invocation ────

  # MCP tool catalog store interface — alias for the session-file implementation.
  Ineersa\CodingAgent\Mcp\Catalog\McpToolCatalogStoreInterface:
    alias: Ineersa\CodingAgent\Mcp\Catalog\SessionFileMcpToolCatalogStore

  # MCP tool registrar — bridges session catalog into ToolRegistry dynamic tools.
  Ineersa\CodingAgent\Mcp\Tool\McpToolRegistrar:
    arguments:
      $catalogStore: '@Ineersa\CodingAgent\Mcp\Catalog\McpToolCatalogStoreInterface'
      $toolRegistry: '@Ineersa\CodingAgent\Tool\ToolRegistryInterface'
      $handlerFactory: '@Ineersa\CodingAgent\Mcp\Tool\McpToolHandlerFactory'

  # McpToolHandler is a value object with string constructor args (serverName,
  # mcpName) plus a service dependency (invoker) — not an autowireable service.
  # Exclude it from the container so Symfony DI does not report missing
  # autowiring for its scalar parameters.
  Ineersa\CodingAgent\Mcp\Tool\McpToolHandler:
    autowire: false

  # ─── AGENT-07 / MCP-05 ExecuteToolCall routing middleware ──────────
  # SubagentExecuteToolCallRoutingMiddleware and McpExecuteToolCallRoutingMiddleware
  # are resource-discovered and autowired; messenger.yaml wires them on agent.execution.bus.

  # ─── AGENT-05 Subagent execution service ──────────────────────────

  # Subagent child-run stack: inherited agents context comes from owner-prepared
  # immutable ExecuteToolCall launch context. Canonical parent progress is submitted
  # to run_control; controller nonterminal progress remains transient.
  # SubagentChildLaunchInputFactory is resource-discovered / autowired.

  # ─── AGENT-05 Subagent tool storage routing ─────────────────────────

  # ChildAwareEventStore — delegates prepared transitions between parent-scoped
  # SessionRunEventStore (parent runs) and AgentChildRunEventStore (child runs).

  Ineersa\CodingAgent\Session\Contract\RunSequenceAllocatorInterface:
    alias: Ineersa\CodingAgent\Session\FileRunSequenceAllocator

  Ineersa\CodingAgent\Session\Repair\SessionRepairServiceInterface:
    alias: Ineersa\CodingAgent\Session\Repair\SessionRepairService

  Ineersa\CodingAgent\Agent\Artifact\ChildAwareEventStore:
    arguments:
      $parentStore: '@Ineersa\CodingAgent\Session\SessionRunEventStore'

  Ineersa\CodingAgent\Agent\Execution\AgentMcpToolsResolver:
    arguments:
      $catalogStore: '@Ineersa\CodingAgent\Mcp\Catalog\McpToolCatalogStoreInterface'
      $configLoader: '@Ineersa\CodingAgent\Mcp\Config\McpConfigLoader'

  Ineersa\CodingAgent\Agent\Execution\AgentToolPolicyResolver:
    arguments:
      $toolRegistry: '@Ineersa\CodingAgent\Tool\ToolRegistryInterface'
      $mcpToolsResolver: '@Ineersa\CodingAgent\Agent\Execution\AgentMcpToolsResolver'
      $agentsConfig: '@Ineersa\CodingAgent\Config\AgentsConfig'


  Ineersa\CodingAgent\Runtime\Controller\CommandHandler\SelectHistoryTurnHandler:
    arguments:
      $commandBus: '@agent.command.bus'

  Ineersa\CodingAgent\Runtime\Controller\CommandHandler\RepairHandler:
    arguments:
      $commandBus: '@agent.command.bus'

  Ineersa\CodingAgent\Application\Pipeline\SubagentProgressCoordinationHandler:
    arguments:
      $commandBus: '@agent.command.bus'
