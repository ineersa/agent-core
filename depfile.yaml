# Run: castor deptrac. Directories within each application component are not
# architectural boundaries. Collect vendor types only where an edge matters.
parameters:
  paths:
    - ./src
    - .hatfield/extensions/extension-api/src
    - .hatfield/extensions/task-workflow/src
    - .hatfield/extensions/observational-memory/src
  exclude_files:
    - .*\.test\.php$
    - .*Test\.php$

  layers:
    - name: AgentCore
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\AgentCore\\#' }
    - name: CodingAgent
      collectors:
        - type: classNameRegex
          value: '#^Ineersa\\CodingAgent\\(?!CLI\\(?:AgentCommand|Setup\\SetupCommand)$|Extension\\Builtin\\)#'
    - name: TuiBootstrap
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\CodingAgent\\CLI\\(?:AgentCommand|Setup\\SetupCommand)$#' }
    - name: Tui
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\Tui\\#' }
    - name: ProviderBridge
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\Platform\\#' }
    - name: ExtensionApi
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\Hatfield\\ExtensionApi\\#' }
    - name: SafeGuard
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\CodingAgent\\Extension\\Builtin\\SafeGuard\\#' }
    - name: Scheduling
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\CodingAgent\\Extension\\Builtin\\Scheduling\\#' }
    # A new built-in gets only the public project API until explicitly classified.
    - name: OtherBuiltinExtension
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\CodingAgent\\Extension\\Builtin\\(?!(?:SafeGuard|Scheduling)\\)#' }
    - name: TaskWorkflow
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\HatfieldExt\\TaskWorkflow\\#' }
    - name: ObservationalMemory
      collectors:
        - { type: classNameRegex, value: '#^Ineersa\\HatfieldExt\\ObservationalMemory\\#' }
    - name: Console
      collectors:
        - { type: classNameRegex, value: '#^Symfony\\Component\\Console\\#' }
    - name: Process
      collectors:
        - { type: classNameRegex, value: '#^Symfony\\Component\\Process\\#' }
    - name: SymfonyTui
      collectors:
        - { type: classNameRegex, value: '#^Symfony\\Component\\Tui\\#' }
    - name: HttpKernel
      collectors:
        - { type: classNameRegex, value: '#^Symfony\\(?:Component\\HttpKernel|Bundle\\FrameworkBundle)\\#' }
    - name: AiPlatform
      collectors:
        - { type: classNameRegex, value: '#^Symfony\\AI\\Platform\\#' }
    - name: McpSdk
      collectors:
        - { type: classNameRegex, value: '#^Mcp\\#' }

  ruleset:
    AgentCore: [AiPlatform]
    CodingAgent: [AgentCore, ProviderBridge, ExtensionApi, Console, Process, HttpKernel, AiPlatform, McpSdk]
    TuiBootstrap: [CodingAgent, Tui, ExtensionApi, Console, SymfonyTui]
    Tui: [CodingAgent, AgentCore, ExtensionApi, Console, Process, SymfonyTui, AiPlatform]
    ProviderBridge: [AiPlatform]
    ExtensionApi: [SymfonyTui]
    SafeGuard: [ExtensionApi]
    Scheduling: [ExtensionApi, SymfonyTui]
    OtherBuiltinExtension: [ExtensionApi]
    TaskWorkflow: [ExtensionApi, McpSdk, Process]
    ObservationalMemory: [ExtensionApi, McpSdk, Process, AiPlatform]

  # Setup lists the two shipped extension entry points. This is not permission
  # for other host services to depend on either extension's implementation.
  skip_violations:
    Ineersa\CodingAgent\CLI\Extensions\ExtensionsSetupFlow:
      - Ineersa\CodingAgent\Extension\Builtin\SafeGuard\SafeGuardExtension
      - Ineersa\CodingAgent\Extension\Builtin\Scheduling\SchedulingExtension
