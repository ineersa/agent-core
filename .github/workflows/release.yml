name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Sole GitHub Actions path that builds PHAR + three native binaries and publishes
# app release assets on v* tags. Manual runs on the default branch prepare
# verified runtimes only. Castor owns all build and verification logic.
jobs:
  phar:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    name: Build canonical PHAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag points at exact checked-out commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          echo "Tag ${TAG} -> ${TAG_SHA}"
          echo "Commit ${GITHUB_SHA}"
          test "${TAG_SHA}" = "${GITHUB_SHA}"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        env:
          fail-fast: true
        with:
          # setup-php selects the minor series; the startup check enforces the pin.
          php-version: "8.5.13"
          extensions: mbstring, xml, intl, curl, openssl, pcntl, posix, tokenizer, ctype, fileinfo, filter, iconv, phar, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Check clean PHP startup
        run: |
          set -euo pipefail
          if ! startup_output="$(php -r '' 2>&1)" || [[ -n "$startup_output" ]]; then
            printf '%s\n' "$startup_output" >&2
            php --ini
            exit 1
          fi
          php -r '
            $pin = json_decode(file_get_contents("tools/static/pin.json"), true, 512, JSON_THROW_ON_ERROR);
            $expected = $pin["php_version"] ?? null;
            if (PHP_VERSION !== $expected) {
                fwrite(STDERR, "Release PHP version mismatch: expected " . var_export($expected, true) . ", got " . PHP_VERSION . "\n");
                exit(1);
            }
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Castor
        uses: ./.github/actions/setup-castor

      - name: Build distribution PHAR via Castor
        env:
          HATFIELD_BUILD_VERSION: ${{ github.ref_name }}
          HATFIELD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          castor distribution:build --release-version="${HATFIELD_BUILD_VERSION}" --commit="${HATFIELD_BUILD_COMMIT}"
          # Host static not present yet; verify PHAR-only with flags.
          castor distribution:verify --skip-topology --allow-missing-native

      - name: Upload hatfield.phar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hatfield.phar
          path: var/tmp/dist/hatfield.phar
          if-no-files-found: error

  static:
    name: Static ${{ matrix.target }}
    needs: [phar]
    # Serialize target jobs across release and manual refs. This also serializes
    # different fingerprints on the same target, without a separate coordinator.
    concurrency:
      group: static-runtime-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install static build prerequisites
        uses: ./.github/actions/static-prerequisites

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        env:
          fail-fast: true
        with:
          php-version: "8.5.13"
          extensions: mbstring, xml, intl, curl, openssl, pcntl, posix, tokenizer, ctype, fileinfo, filter, iconv, phar, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Check clean PHP startup
        run: |
          set -euo pipefail
          if ! startup_output="$(php -r '' 2>&1)" || [[ -n "$startup_output" ]]; then
            printf '%s\n' "$startup_output" >&2
            php --ini
            exit 1
          fi
          php -r '
            $pin = json_decode(file_get_contents("tools/static/pin.json"), true, 512, JSON_THROW_ON_ERROR);
            $expected = $pin["php_version"] ?? null;
            if (PHP_VERSION !== $expected) {
                fwrite(STDERR, "Release PHP version mismatch: expected " . var_export($expected, true) . ", got " . PHP_VERSION . "\n");
                exit(1);
            }
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Castor
        uses: ./.github/actions/setup-castor

      - name: Fingerprint compiled native runtime inputs
        id: runtime
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          fingerprint="$(castor distribution:runtime-fingerprint --target="${TARGET}")"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Restore published runtime if present
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.runtime.outputs.fingerprint }}
        run: |
          set -euo pipefail
          tag="static-runtime-${FINGERPRINT}"
          # An exhaustive successful listing is the only evidence of absence.
          match="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "'"${tag}"'") | [.draft, .prerelease] | @tsv')"
          if [[ "$match" == $'true\ttrue' ]]; then
            # This target's serialized job owns recovery of an interrupted upload.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            match=''
          fi
          if [[ -z "$match" ]]; then
            echo 'hit=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$match" != $'false\ttrue' ]]; then
            echo "Unexpected release state for ${tag}; inspect before retrying" >&2
            exit 1
          fi
          destination="var/tmp/static-runtime/${FINGERPRINT}"
          mkdir -p "$destination"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$destination" \
            --pattern php --pattern micro.sfx --pattern sha256.json --pattern provenance.json
          chmod +x "$destination/php"
          echo 'hit=true' >> "$GITHUB_OUTPUT"

      - name: Download canonical PHAR handoff from PHAR job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hatfield.phar
          path: var/tmp/dist

      - name: Build static binary via Castor (exact PHAR handoff)
        # Historical cold builds took up to about 22 minutes; leave room for variance.
        timeout-minutes: 45
        env:
          HATFIELD_BUILD_VERSION: ${{ github.ref_name }}
          HATFIELD_BUILD_COMMIT: ${{ github.sha }}
          RUNTIME_HIT: ${{ steps.restore.outputs.hit }}
          # SPC reads GITHUB_TOKEN for GitHub dependency API/downloads (rate limits).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Portable SHA-256 (Linux sha256sum, macOS shasum).
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | awk '{print $1}'
            else
              echo "ERROR: need sha256sum or shasum -a 256" >&2
              exit 1
            fi
          }
          # Canonical handoff: distribution:build-static must use this file as-is
          # (smoke + identity check) and must not rebuild/overwrite it.
          test -s var/tmp/dist/hatfield.phar
          PHAR_SHA="$(hash_file var/tmp/dist/hatfield.phar)"
          echo "PHAR handoff sha256=${PHAR_SHA}"
          if [[ "$RUNTIME_HIT" == true ]]; then
            set -- --require-cached-runtime
          else
            set --
          fi
          castor distribution:build-static --target=${{ matrix.target }} --release-version="${HATFIELD_BUILD_VERSION}" --commit="${HATFIELD_BUILD_COMMIT}" "$@"
          test -s var/tmp/dist/hatfield.phar
          AFTER_SHA="$(hash_file var/tmp/dist/hatfield.phar)"
          test "${PHAR_SHA}" = "${AFTER_SHA}"
          # Host-native topology is required on each matrix runner.
          castor distribution:verify

      - name: Publish verified runtime prerelease
        if: steps.restore.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.runtime.outputs.fingerprint }}
        run: |
          set -euo pipefail
          tag="static-runtime-${FINGERPRINT}"
          runtime="var/tmp/static-runtime/${FINGERPRINT}"
          # Publish only after all assets have uploaded. Never clobber an asset.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --latest=false --title "$tag" \
            --notes 'Verified native runtime and SPC download inventory for this fingerprint.'
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "$runtime/php" "$runtime/micro.sfx" "$runtime/sha256.json" "$runtime/provenance.json"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

      - name: Upload static artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hatfield.${{ matrix.target }}
          path: |
            var/tmp/dist/hatfield.${{ matrix.target }}
            var/tmp/dist/runtime-${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Aggregate, checksum, publish release
    needs: [phar, static]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Re-validate tag commit
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          test "${TAG_SHA}" = "${GITHUB_SHA}"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        env:
          fail-fast: true
        with:
          php-version: "8.5.13"
          extensions: mbstring, xml, intl, curl, openssl, pcntl, posix, tokenizer, ctype, fileinfo, filter, iconv, phar, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Check clean PHP startup
        run: |
          set -euo pipefail
          if ! startup_output="$(php -r '' 2>&1)" || [[ -n "$startup_output" ]]; then
            printf '%s\n' "$startup_output" >&2
            php --ini
            exit 1
          fi
          php -r '
            $pin = json_decode(file_get_contents("tools/static/pin.json"), true, 512, JSON_THROW_ON_ERROR);
            $expected = $pin["php_version"] ?? null;
            if (PHP_VERSION !== $expected) {
                fwrite(STDERR, "Release PHP version mismatch: expected " . var_export($expected, true) . ", got " . PHP_VERSION . "\n");
                exit(1);
            }
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Castor
        uses: ./.github/actions/setup-castor

      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: var/tmp/dist
          merge-multiple: true

      - name: Normalize complete artifact set
        run: |
          set -euo pipefail
          required=(
            hatfield.phar
            hatfield.linux-amd64
            hatfield.linux-arm64
            hatfield.darwin-arm64
          )
          for name in "${required[@]}"; do
            path="var/tmp/dist/${name}"
            if [[ ! -s "${path}" ]]; then
              echo "MISSING required release asset: ${path}"
              find var/tmp/dist -type f -print
              exit 1
            fi
            size="$(wc -c < "${path}")"
            echo "OK ${name} bytes=${size}"
            if [[ "${size}" -lt 1000000 || "${size}" -gt 100000000 ]]; then
              echo "ERROR: ${name} size out of bounds (${size})"
              exit 1
            fi
          done
          chmod +x var/tmp/dist/hatfield.linux-amd64 \
                   var/tmp/dist/hatfield.linux-arm64 \
                   var/tmp/dist/hatfield.darwin-arm64

      - name: Generate one SHA256SUMS for every asset via Castor
        run: |
          set -euo pipefail
          castor distribution:checksums
          # Verify checksums + PHAR content; native topology already ran per matrix runner.
          castor distribution:verify --skip-topology
          # Ensure SHA256SUMS lists exactly the seven payloads.
          test -s var/tmp/dist/SHA256SUMS
          for name in hatfield.phar hatfield.linux-amd64 hatfield.linux-arm64 hatfield.darwin-arm64 runtime-linux-amd64.json runtime-linux-arm64.json runtime-darwin-arm64.json; do
            grep -E "^[a-f0-9]{64}  ${name}\$" var/tmp/dist/SHA256SUMS
          done
          test "$(grep -cE '^[a-f0-9]{64}  ' var/tmp/dist/SHA256SUMS)" -eq 7

      - name: Host-compatible version smoke
        run: |
          set -euo pipefail
          php var/tmp/dist/hatfield.phar --version | tee /tmp/phar-version.txt
          grep -q 'Hatfield' /tmp/phar-version.txt
          grep -q 'commit' /tmp/phar-version.txt
          ./var/tmp/dist/hatfield.linux-amd64 --version | tee /tmp/native-version.txt
          grep -q 'Hatfield' /tmp/native-version.txt
          grep -q 'commit' /tmp/native-version.txt

      - name: Create GitHub Release with complete asset set
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Hatfield ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            var/tmp/dist/hatfield.phar
            var/tmp/dist/hatfield.linux-amd64
            var/tmp/dist/hatfield.linux-arm64
            var/tmp/dist/hatfield.darwin-arm64
            var/tmp/dist/runtime-linux-amd64.json
            var/tmp/dist/runtime-linux-arm64.json
            var/tmp/dist/runtime-darwin-arm64.json
            var/tmp/dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One-way monorepo split mirrors for Extension API and project extensions.
  # Destination repositories are pre-provisioned outside this workflow; missing
  # MONOREPO_SPLIT_TOKEN or a missing destination repo must fail the matrix cell.
  package-split:
    name: Split ${{ matrix.package.repository }}
    needs: [publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - directory: .hatfield/extensions/extension-api
            repository: hatfield-extension-api
          - directory: .hatfield/extensions/task-workflow
            repository: hatfield-ext-task-workflow
          - directory: .hatfield/extensions/observational-memory
            repository: hatfield-ext-observational-memory
    steps:
      - name: Require MONOREPO_SPLIT_TOKEN
        env:
          MONOREPO_SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MONOREPO_SPLIT_TOKEN}" ]]; then
            echo "ERROR: secret MONOREPO_SPLIT_TOKEN is missing or empty."
            echo "Provision a least-privilege token with contents:write on the split repositories"
            echo "and add it as repository secret MONOREPO_SPLIT_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag points at exact checked-out commit
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          test "${TAG_SHA}" = "${GITHUB_SHA}"

      - name: Split package directory to mirror repository
        # danharrin/monorepo-split-github-action v2.4.5 (immutable commit SHA)
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.package.directory }}
          repository_organization: ineersa
          repository_name: ${{ matrix.package.repository }}
          branch: main
          tag: ${{ github.ref_name }}
          user_name: hatfield-release-bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
