name: Install static-php-cli build prerequisites
description: >
  Environment setup only for host static builds (re2c/flex/gperf + compiler toolchain).
  All Hatfield build/verify logic remains in Castor.

runs:
  using: composite
  steps:
    - name: Install static build tools
      shell: bash
      run: |
        set -euo pipefail
        os="$(uname -s)"
        case "${os}" in
          Linux)
            # SPC preflight (see .castor/distribution.php) requires re2c/flex/gperf
            # plus a C toolchain; apt packages match Ubuntu GitHub runners.
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              cmake \
              pkg-config \
              autoconf \
              automake \
              libtool \
              re2c \
              flex \
              gperf \
              bison
            ;;
          Darwin)
            # Homebrew equivalents; flex is keg-only and must be on PATH for SPC.
            brew update
            brew install cmake pkg-config autoconf automake libtool flex gperf bison
            if [[ "$(uname -m)" == "x86_64" ]]; then
              # Homebrew no longer publishes an Intel macOS bottle for re2c.
              brew install --build-from-source re2c
            else
              brew install re2c
            fi
            FLEX_PREFIX="$(brew --prefix flex)"
            echo "${FLEX_PREFIX}/bin" >> "${GITHUB_PATH}"
            export PATH="${FLEX_PREFIX}/bin:${PATH}"
            ;;
          *)
            echo "Unsupported runner OS for static prerequisites: ${os}" >&2
            exit 1
            ;;
        esac

        missing=()
        for tool in re2c flex gperf make cmake; do
          if ! command -v "${tool}" >/dev/null 2>&1; then
            missing+=("${tool}")
          fi
        done
        if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
          missing+=("cc/gcc/clang")
        fi
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "Static prerequisites still missing after install: ${missing[*]}" >&2
          exit 1
        fi
        echo "Static prerequisites OK: re2c=$(command -v re2c) flex=$(command -v flex) gperf=$(command -v gperf)"
