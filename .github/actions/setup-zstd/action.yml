name: Install pinned zstd with PIE
description: Install and verify zstd for the system PHP used by the release workflow
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        pie="$(command -v pie)"
        # PIE needs write access to PHP's ini and extension directories on Linux.
        php_bin="$(command -v php)"
        php_config="$(command -v php-config)"
        if [[ "$RUNNER_OS" == Linux ]]; then
          sudo --non-interactive env "PATH=$PATH" "$pie" install --no-interaction --with-php-config="$php_config" kjdev/zstd:0.19.0
        else
          "$pie" install --no-interaction --with-php-config="$php_config" kjdev/zstd:0.19.0
        fi
        "$php_bin" -r 'if (phpversion("zstd") !== "0.19.0") { fwrite(STDERR, "Expected zstd 0.19.0 to be loaded\n"); exit(1); }'
